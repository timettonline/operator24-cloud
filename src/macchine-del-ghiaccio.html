    var SCHEMA=[
      {t:'gruppo',k:'home',l:'Schermata iniziale',campi:[
        {t:'testo',k:'kick',l:'Scritta piccola in alto'},
        {t:'testo',k:'titolo',l:'Titolo'},
        {t:'area',k:'sub',l:'Sottotitolo'},

        {t:'testo',k:'badge',l:'Etichetta del marchio',aiuto:'La scritta piccola colorata sulle card e accanto al nome della gamma.'},
        {t:'testo',k:'titoloCarat',l:'Titolo dell\'elenco caratteristiche dei modelli'},
        {t:'testo',k:'titoloVant',l:'Titolo dell\'elenco vantaggi delle gamme'}]},
      {t:'lista',k:'famiglie',l:'Tipi di ghiaccio (una card ciascuno)',agg:'Aggiungi un tipo di ghiaccio',titolo:'name',miniatura:'card',min:1,

            aiuto:'Ogni modello è un pulsante nella pagina; ha una sola foto.',
            nuovo:{name:'',img:'',text:'',feats:[]},

              {t:'testo',k:'name',l:'Nome del modello'},

              {t:'lista',k:'feats',l:'Caratteristiche (elenco con spunte)',agg:'Aggiungi una caratteristica',voce:{t:'testo',l:'Caratteristica'},
                aiuto:'Se l\'elenco è vuoto, il titolo non compare.'}
            ]}},
          {t:'lista',k:'vant',l:'Vantaggi di questo ghiaccio (elenco con spunte)',agg:'Aggiungi un vantaggio',voce:{t:'testo',l:'Vantaggio'},
            aiuto:'Compaiono sotto le caratteristiche di ogni modello.'}
        ]}}
    ];

    var FAM={}, ORDER=[], cur={}, TX={};

    function renderFam(k){
      var f=FAM[k];
      var chips=f.models.map(function(m,i){return '<button class="mchip'+(i===0?' on':'')+'" type="button" data-i="'+i+'">'+esc(m.name)+'</button>';}).join('');
      var vant=f.vant&&f.vant.length?'<h6 class="eyer">'+esc(TX.titoloVant)+'</h6><ul class="blist">'+f.vant.map(function(x){return '<li>'+CK+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>':'';
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button><span class="badge">'+esc(TX.badge)+'</span><h2>'+esc(f.name)+'</h2></div>'
        +'<div class="fdesc">'+esc(f.desc)+'</div>'
        +'<div class="modelbar" data-fam="'+k+'">'+chips+'</div>'
        +'<div class="fbody">'
          +'<div class="gal"><div class="main pz ct"><img id="gm-'+k+'"></div></div>'
          +'<div class="fspec"><h5 id="mn-'+k+'"></h5><div id="fs-'+k+'"></div>'+vant+'</div>'
        +'</div>';
    }

    function setModel(k,i){
      var f=FAM[k],m=f&&f.models[i]; if(!m) return;
      document.getElementById('mn-'+k).textContent=m.name;
      var html='';
      if(m.text) html+='<p class="mtext">'+esc(m.text)+'</p>';
      if(m.feats.length) html+='<h6 class="eyer">'+esc(TX.titoloCarat)+'</h6><ul class="blist">'+m.feats.map(function(x){return '<li>'+CK+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>';
      document.getElementById('fs-'+k).innerHTML=html;
      var gm=document.getElementById('gm-'+k); gm.src=m.img||''; gm.alt=m.name;
      var bar=document.querySelector('.modelbar[data-fam="'+k+'"]');
      if(bar) bar.querySelectorAll('.mchip').forEach(function(c,ci){c.classList.toggle('on',ci===i);});
      var fs=document.querySelector('#v-'+k+' .fspec'); if(fs) fs.scrollTop=0;
    }

    /* disegna tutto a partire dai dati */
    function render(d){
      FAM={}; ORDER=[]; cur={}; TX=d.home||{};
      d.famiglie.forEach(function(f,i){ var k='f'+i; FAM[k]=f; ORDER.push(k); });
      document.getElementById('fc-kick').textContent=TX.kick;
      document.getElementById('fc-titolo').textContent=TX.titolo;
      document.getElementById('fc-sub').textContent=TX.sub;
      document.getElementById('fc-foot').textContent=TX.foot;
      /* home cards */
      document.getElementById('cards').innerHTML=ORDER.map(function(k){var f=FAM[k];
        return '<button class="card" type="button" data-open="'+k+'"><div class="ph"><div class="pz ct"><img src="'+esc(f.card)+'" alt="'+esc(f.name)+'" loading="lazy"></div></div>'
          +'<div class="bd"><span class="badge">'+esc(TX.badge)+'</span><h3>'+esc(f.name)+'</h3><p>'+esc(f.tag)+'</p><div class="go">Scopri →</div></div></button>';
      }).join('');
      /* viste delle gamme */
      root.querySelectorAll('.view:not(.home)').forEach(function(v){v.remove();});
      var fine=root.querySelector('script');
      ORDER.forEach(function(k){
        var v=document.createElement('div'); v.className='view'; v.setAttribute('data-view',k); v.id='v-'+k;
        v.innerHTML=renderFam(k); root.insertBefore(v,fine);
      });
      ORDER.forEach(function(k){ setModel(k,0); });
      show('home');
    }

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ var v=op.getAttribute('data-open'); show(v); setModel(v,0); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var mc=e.target.closest('.mchip'); if(mc){ var k=mc.closest('.modelbar').getAttribute('data-fam'); setModel(k,+mc.getAttribute('data-i')); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });

    FCKit.avvia({id:'macchine-del-ghiaccio',nome:'Macchine del ghiaccio',dati:DATI,schema:SCHEMA,render:render,ingranaggio:{pos:'br',tono:'chiaro'}});
  })();

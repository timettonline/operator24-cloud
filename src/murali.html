    var SCHEMA=[
      {t:'gruppo',k:'home',l:'Schermata iniziale',campi:[
        {t:'testo',k:'kick',l:'Scritta piccola in alto'},
        {t:'testo',k:'titolo',l:'Titolo'},

        voce:{t:'gruppo',campi:[
          {t:'testo',k:'name',l:'Nome della gamma'},
          {t:'img',k:'card',l:'Foto della card'},
          {t:'testo',k:'tag',l:'Scritta sotto il nome nella card',aiuto:'Es. "3 modelli · Banchi a servizio".'},
          {t:'area',k:'desc',l:'Descrizione della gamma'},
          {t:'lista',k:'models',l:'Modelli',agg:'Aggiungi un modello',titolo:'name',miniatura:'img',min:1,
            nuovo:{name:'',img:'',text:'',tags:[]},
            voce:{t:'gruppo',campi:[
              {t:'testo',k:'name',l:'Nome del modello'},
              {t:'img',k:'img',l:'Foto'},
              {t:'area',k:'text',l:'Descrizione del modello',righe:5},
              {t:'lista',k:'tags',l:'Etichette (caratteristiche in breve)',agg:'Aggiungi un\'etichetta',voce:{t:'testo',l:'Etichetta'},
                aiuto:'Le piccole scritte sotto la descrizione, es. "Con porte".'}
            ]}}
        ]}}
    ];

    var FAM={}, ORDER=[], H={};

    function renderFam(k){
      var f=FAM[k];
      var chips=f.models.map(function(m,i){return '<button class="mchip'+(i===0?' on':'')+'" type="button" data-i="'+i+'">'+esc(m.name)+'</button>';}).join('');
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button><span class="badge">'+esc(H.badge)+'</span><h2>'+esc(f.name)+'</h2></div>'
        +'<div class="fdesc">'+esc(f.desc)+'</div>'
        +'<div class="modelbar" data-fam="'+k+'">'+chips+'</div>'
        +'<div class="fbody">'
          +'<div class="gal"><div class="main pz"><img id="gm-'+k+'"></div></div>'
          +'<div class="fspec"><h5 id="mn-'+k+'"></h5><p class="mtext" id="fs-'+k+'"></p><div class="tags" id="tg-'+k+'"></div></div>'
        +'</div>';
    }

    function setModel(k,i){
      var f=FAM[k]; if(!f||!f.models.length) return; var m=f.models[i];
      document.getElementById('mn-'+k).textContent=m.name;
      document.getElementById('fs-'+k).textContent=m.text;
      document.getElementById('tg-'+k).innerHTML=(m.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
      var gm=document.getElementById('gm-'+k); gm.src=m.img||''; gm.alt=m.name;
      var bar=document.querySelector('.modelbar[data-fam="'+k+'"]');
      if(bar) bar.querySelectorAll('.mchip').forEach(function(c,ci){c.classList.toggle('on',ci===i);});
      var fs=document.querySelector('#v-'+k+' .fspec'); if(fs) fs.scrollTop=0;
    }

    /* disegna tutto a partire dai dati */
    function render(d){
      FAM={}; ORDER=[]; H=d.home;
      d.famiglie.forEach(function(f,i){ var k='f'+i; FAM[k]=f; ORDER.push(k); });
      document.getElementById('fc-kick').textContent=H.kick;
      document.getElementById('fc-titolo').textContent=H.titolo;
      document.getElementById('fc-sub').textContent=H.sub;
      document.getElementById('fc-foot').textContent=H.foot;
      /* home cards */
      document.getElementById('cards').innerHTML=ORDER.map(function(k){var f=FAM[k];
        return '<button class="card" type="button" data-open="'+k+'"><div class="ph"><div class="pz"><img src="'+f.card+'" alt="'+esc(f.name)+'" loading="lazy"></div></div>'
          +'<div class="bd"><span class="badge">'+esc(H.badge)+'</span><h3>'+esc(f.name)+'</h3><p>'+esc(f.tag)+'</p><div class="go">Scopri →</div></div></button>';
      }).join('');
      /* viste delle gamme */
      root.querySelectorAll('.view:not(.home)').forEach(function(v){v.remove();});
      var fine=root.querySelector('script');
      ORDER.forEach(function(k){
        var v=document.createElement('div'); v.className='view'; v.setAttribute('data-view',k); v.id='v-'+k;
        v.innerHTML=renderFam(k); root.insertBefore(v,fine);
      });
      ORDER.forEach(function(k){ setModel(k,0); });
      show('home');
    }

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ var v=op.getAttribute('data-open'); show(v); setModel(v,0); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var mc=e.target.closest('.mchip'); if(mc){ var k=mc.closest('.modelbar').getAttribute('data-fam'); setModel(k,+mc.getAttribute('data-i')); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });

    FCKit.avvia({id:'murali',nome:'Murali',dati:DATI,schema:SCHEMA,render:render,ingranaggio:{pos:'br',tono:'chiaro'}});
  })();

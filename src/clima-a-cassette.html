    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);position:relative;height:100%;width:100%;overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0%,#eef4f8 100%);-webkit-tap-highlight-color:transparent;
  }
  #fc-app img{max-width:100%;display:block}
  #fc-app h1,#fc-app h2,#fc-app h3,#fc-app h4{color:var(--blu);line-height:1.15}
  #fc-app .pz{position:relative;overflow:hidden;border-radius:10px;background:#eef2f5}
  #fc-app .pz img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
  #fc-app .pz.ct img{object-fit:contain;background:#fff}
  #fc-app .pz::after{content:"";position:absolute;inset:0;z-index:2}

  #fc-app .view{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1200px;display:none;flex-direction:column;padding:clamp(12px,2vw,22px);gap:10px}
  #fc-app .view.on{display:flex;animation:fd .25s ease}
  @keyframes fd{from{opacity:0}to{opacity:1}}

  #fc-app .kick{letter-spacing:.12em;text-transform:uppercase;font-size:.6rem;font-weight:800;color:var(--accent);text-align:center;flex:0 0 auto}
  #fc-app .home h1{font-size:clamp(1rem,2.2vw,1.5rem);font-weight:800;text-align:center;flex:0 0 auto}
  #fc-app .home .sub{text-align:center;color:var(--muto);font-size:.82rem;max-width:640px;margin:0 auto;flex:0 0 auto}
  #fc-app .cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--fc-n,2),1fr);gap:14px}
  @media(max-width:640px){#fc-app .cards{grid-template-columns:1fr}}
  #fc-app .card{min-height:0;display:flex;flex-direction:column;border:1px solid var(--bordo);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(10,61,98,.10);cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
  #fc-app .card:hover{box-shadow:0 14px 30px rgba(10,61,98,.18)}
  #fc-app .card .ph{flex:1;min-height:0}
  #fc-app .card .bd{flex:0 0 auto;padding:11px 14px 13px}
  #fc-app .badge{display:inline-block;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff}
  #fc-app .mlz .badge,#fc-app .badge.mlz{background:linear-gradient(135deg,#0a3d62,#2e7bb0)}
  #fc-app .slz .badge,#fc-app .badge.slz{background:linear-gradient(135deg,#12557f,#00a8e8)}
  #fc-app .card h3{font-size:.98rem;margin:7px 0 2px}
  #fc-app .card .mod{font-size:.7rem;color:var(--muto);font-weight:600;margin-bottom:5px}
  #fc-app .card p{font-size:.78rem}
  #fc-app .card .go{margin-top:6px;font-weight:700;color:var(--accent);font-size:.78rem}
  #fc-app .foot{flex:0 0 auto;text-align:center;color:var(--muto);font-size:.7rem}

  #fc-app .top{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #fc-app .back{background:none;border:none;cursor:pointer;color:var(--blu);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;font-family:inherit;padding:2px 4px}
  #fc-app .back:hover{color:var(--accent)}
  #fc-app .top h2{font-size:clamp(.95rem,1.8vw,1.2rem)}
  #fc-app .top .mod{color:var(--muto);font-weight:600;font-size:.75rem}
  #fc-app .tabs{flex:0 0 auto;display:flex;gap:6px;border-bottom:1px solid var(--bordo)}
  #fc-app .tab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font:inherit;color:var(--muto);font-weight:700;font-size:.8rem;padding:7px 10px;margin-bottom:-1px}
  #fc-app .tab.on{color:var(--blu);border-bottom-color:var(--accent)}
  #fc-app .stage{flex:1;min-height:0;position:relative}
  #fc-app .pane{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  #fc-app .pane.on{display:block}

  #fc-app .pano{height:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  @media(max-width:640px){#fc-app .pano{grid-template-columns:1fr;grid-template-rows:1fr auto}}
  #fc-app .gal{min-height:0;display:flex;flex-direction:column;gap:8px}
  #fc-app .gal .main{flex:1;min-height:0}
  #fc-app .gal .thumbs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #fc-app .gal .thumbs .t{height:42px;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;padding:0;background:none}
  #fc-app .gal .thumbs .t.on{border-color:var(--accent)}
  #fc-app .gal .thumbs .t .pz,#fc-app .gal .thumbs .t img{height:100%;border-radius:0}
  #fc-app .side{min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  #fc-app .side .intro{font-size:.85rem;color:var(--testo);margin-bottom:12px}
  #fc-app .side h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muto);margin-bottom:8px}
  #fc-app .spec{list-style:none;display:grid;gap:7px;margin-bottom:14px}
  #fc-app .spec li{display:flex;gap:8px;align-items:flex-start;font-size:.86rem}
  #fc-app .spec li svg{flex:0 0 15px;margin-top:2px;color:var(--accent)}
  #fc-app .chips{display:flex;flex-wrap:wrap;gap:7px}
  #fc-app .chip{display:inline-flex;align-items:center;gap:5px;background:var(--grigio);border:1px solid var(--bordo);color:var(--blu);border-radius:999px;padding:4px 9px;font-size:.68rem;font-weight:600}
  #fc-app .chip svg{color:var(--accent)}

  #fc-app .feats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){#fc-app .feats{grid-template-columns:1fr}}
  #fc-app .fcard{border:1px solid var(--bordo);border-radius:11px;background:#fff;box-shadow:0 6px 16px rgba(10,61,98,.08);padding:12px 14px}
  #fc-app .fcard h5{font-size:.86rem;color:var(--blu);margin-bottom:4px;display:flex;gap:6px;align-items:center}
  #fc-app .fcard h5 svg{color:var(--accent);flex:0 0 auto}
  #fc-app .fcard p{font-size:.76rem;color:var(--muto);line-height:1.4}

  #fc-app .tec{display:flex;flex-direction:column;gap:10px}
  #fc-app .tec .tbox{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;border-radius:10px;padding:12px 14px;font-size:.8rem;line-height:1.5}
  #fc-app .tec .tbox b{color:#bfe9ff}
  #fc-app .tec .twrap{overflow:auto;border:1px solid var(--bordo);border-radius:10px;background:#fff}
  #fc-app table.tt{border-collapse:collapse;width:100%;min-width:520px;font-size:.72rem}
  #fc-app table.tt th,#fc-app table.tt td{border:1px solid var(--bordo);padding:6px 8px;text-align:center}
  #fc-app table.tt thead th{background:var(--blu);color:#fff}
  #fc-app table.tt tbody th{background:var(--grigio);color:var(--blu);text-align:left;white-space:nowrap}
  #fc-app table.tt tr.grp th{background:var(--blu2);color:#fff;text-align:left}
  #fc-app table.tt td.na{color:var(--muto)}
  #fc-app .tec .tmulti{font-size:.82rem;color:var(--testo)}
  #fc-app .tec .tmulti b{color:var(--blu)}
  #fc-app .tec .note{font-size:.7rem;color:var(--muto)}
  </style>

    var LINEE={}, ORDINE=[];
    var GRIGIO=/^(—|-|solo multi|multisplit)$/i;
    function tabellaHTML(tb){
      var n=tb.intestazioni.length;
      return '<table class="tt"><thead><tr>'+tb.intestazioni.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'
        +tb.righe.map(function(r){
          if(r.gruppo!==undefined) return '<tr class="grp"><th colspan="'+n+'">'+esc(r.gruppo)+'</th></tr>';
          var c=r.celle||[]; var s='<tr><th>'+esc(c[0]==null?'':c[0])+'</th>';
          for(var i=1;i<n;i++){ var v=c[i]==null?'':String(c[i]); s+='<td'+(GRIGIO.test(v.trim())?' class="na"':'')+'>'+esc(v)+'</td>'; }
          return s+'</tr>';
        }).join('')+'</tbody></table>';
    }
    function render1(k){
      var d=LINEE[k];
      var thumbs=d.gallery.map(function(g,i){return '<button type="button" class="t'+(i===0?' on':'')+'" data-i="'+i+'"><span class="pz"><img src="'+g.s+'" alt="'+esc(g.c)+'" loading="lazy"></span></button>';}).join('');
      var spec=d.spec.map(function(s){return '<li>'+CK+'<span>'+esc(s)+'</span></li>';}).join('');
      var chips=d.chips.map(function(c){return '<span class="chip">'+ic(c)+esc(c)+'</span>';}).join('');
      var feats=d.feats.map(function(f){return '<div class="fcard"><h5>'+sv(P[f.i]||P.leaf)+esc(f.t)+'</h5><p>'+esc(f.p)+'</p></div>';}).join('');
      var g0=d.gallery[0]||{s:'',c:''};
      var tb=d.tabella||{intestazioni:[],righe:[]}, im=d.tecImgs||[], mu=d.multi||[];
      var tec='<div class="tbox">'+grassetto(d.tecBox)+'</div>'
        +(tb.righe&&tb.righe.length?('<div class="twrap">'+tabellaHTML(tb)+'</div>'):'')
        +im.map(function(u){return '<div class="timg"><img src="'+u+'" alt="Scheda tecnica" loading="lazy"></div>';}).join('')
        +(mu.length?('<div class="tmulti"><b>Sistema multisplit:</b> '+mu.map(esc).join(' · ')+'</div>'):'')
        +'<div class="note">'+esc(d.nota)+'</div>';
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button>'
        +'<span class="badge '+esc(d.cls)+'">'+esc(d.badge)+'</span><h2>'+esc(d.titolo)+'</h2><span class="mod">'+esc(d.mod)+'</span></div>'
        +'<div class="tabs"><button class="tab on" data-tab="0">Panoramica</button><button class="tab" data-tab="1">Dettagli</button><button class="tab" data-tab="2">Scheda tecnica</button></div>'
        +'<div class="stage">'
          +'<div class="pane on" data-pane="0"><div class="pano">'
            +'<div class="gal"><div class="main pz ct"><img id="m-'+k+'" src="'+g0.s+'" alt="'+esc(g0.c)+'"></div><div class="thumbs" data-th="'+k+'">'+thumbs+'</div></div>'
            +'<div class="side"><div class="intro">'+esc(d.intro)+'</div><h4>Caratteristiche principali</h4><ul class="spec">'+spec+'</ul><div class="chips">'+chips+'</div></div>'
          +'</div></div>'
          +'<div class="pane" data-pane="1"><div class="feats">'+feats+'</div></div>'
          +'<div class="pane" data-pane="2"><div class="tec">'+tec+'</div></div>'
        +'</div>';
    }

    function render(dati){
      LINEE={}; ORDINE=[];
      dati.linee.forEach(function(l,i){ var k='l'+i; LINEE[k]=l; ORDINE.push(k); });
      document.getElementById('fc-kick').textContent=dati.home.kick;
      document.getElementById('fc-titolo').textContent=dati.home.titolo;
      document.getElementById('fc-sub').textContent=dati.home.sub;
      document.getElementById('fc-foot').textContent=dati.home.foot;
      var cards=document.getElementById('fc-cards');
      cards.style.setProperty('--fc-n',String(Math.max(1,ORDINE.length)));
      cards.innerHTML=ORDINE.map(function(k){var d=LINEE[k],c=d.card||{};
        return '<button class="card '+esc(d.cls)+'" type="button" data-open="'+k+'">'
          +'<div class="ph pz"><img src="'+(c.img||'')+'" alt="'+esc(d.badge+' '+String(d.mod).replace(/^Serie /,''))+'" loading="lazy"></div>'
          +'<div class="bd"><span class="badge">'+esc(d.badge)+'</span><h3>'+esc(c.titolo)+'</h3><div class="mod">'+esc(d.mod)+'</div><p>'+esc(c.testo)+'</p><div class="go">Scopri →</div></div></button>';
      }).join('');
      root.querySelectorAll('.view:not(.home)').forEach(function(v){v.remove();});
      var fine=root.querySelector('script');
      ORDINE.forEach(function(k){
        var v=document.createElement('div'); v.className='view'; v.setAttribute('data-view',k); v.id='v-'+k;
        v.innerHTML=render1(k); root.insertBefore(v,fine);
      });
      show('home');
    }

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ show(op.getAttribute('data-open')); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var tb=e.target.closest('.tab'); if(tb){ var wrap=tb.closest('.view'); var i=tb.getAttribute('data-tab');
        wrap.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===tb);});
        wrap.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-pane')===i);}); return; }
      var th=e.target.closest('.thumbs .t'); if(th){ var row=th.parentNode; var key=row.getAttribute('data-th'); var idx=+th.getAttribute('data-i');
        var g=LINEE[key].gallery[idx]; var m=document.getElementById('m-'+key); m.src=g.s; m.alt=g.c;
        row.querySelectorAll('.t').forEach(function(x){x.classList.remove('on');}); th.classList.add('on'); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });

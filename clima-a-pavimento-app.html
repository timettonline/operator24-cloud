<!-- =====================================================================
     Frigo Control Ticino — Climatizzatori a pavimento — APP A SCHERMATA FISSA
     - App-shell: riempie l'elemento (larghezza x altezza) e NON cresce mai
     - Ogni vista (home / prodotti) occupa lo STESSO spazio fisso
     - Contenuti completi, organizzati in TAB dentro il box (niente scroll di pagina)
     - Su Wix: Incorpora HTML -> imposta larghezza e altezza (consigliato ~680px)
     ===================================================================== -->
<div id="fc-app">
  <style>
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  #fc-app *{box-sizing:border-box;margin:0;padding:0}
  #fc-app{
    --blu:#0a3d62;--blu2:#1e6091;--accent:#00a8e8;--grigio:#f4f6f8;--bordo:#e3e9ef;--testo:#22303a;--muto:#6b7b88;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);position:relative;height:100%;width:100%;overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0%,#eef4f8 100%);-webkit-tap-highlight-color:transparent;
  }
  #fc-app img{max-width:100%;display:block}
  #fc-app h1,#fc-app h2,#fc-app h3,#fc-app h4{color:var(--blu);line-height:1.15}
  #fc-app .pz{position:relative;overflow:hidden;border-radius:10px;background:#eef2f5}
  #fc-app .pz img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
  #fc-app .pz.ct img{object-fit:contain;background:#fff}
  #fc-app .pz::after{content:"";position:absolute;inset:0;z-index:2}

  /* ogni vista riempie lo stesso box */
  #fc-app .view{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,2vw,20px);gap:10px}
  #fc-app .view.on{display:flex;animation:fd .25s ease}
  @keyframes fd{from{opacity:0}to{opacity:1}}

  /* ---- HOME ---- */
  #fc-app .kick{letter-spacing:.12em;text-transform:uppercase;font-size:.6rem;font-weight:800;color:var(--accent);text-align:center;flex:0 0 auto}
  #fc-app .home h1{font-size:clamp(1rem,2.2vw,1.5rem);font-weight:800;text-align:center;flex:0 0 auto}
  #fc-app .home .sub{text-align:center;color:var(--muto);font-size:.82rem;max-width:600px;margin:0 auto;flex:0 0 auto}
  #fc-app .cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){#fc-app .cards{grid-template-columns:1fr}}
  #fc-app .card{min-height:0;display:flex;flex-direction:column;border:1px solid var(--bordo);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(10,61,98,.10);cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
  #fc-app .card:hover{box-shadow:0 14px 30px rgba(10,61,98,.18)}
  #fc-app .card .ph{flex:1;min-height:0}
  #fc-app .card .bd{flex:0 0 auto;padding:11px 14px 13px}
  #fc-app .badge{display:inline-block;font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff}
  #fc-app .sfz .badge,#fc-app .badge.sfz{background:linear-gradient(135deg,#062a4d,#1e6091)}
  #fc-app .mfz .badge,#fc-app .badge.mfz{background:linear-gradient(135deg,#12557f,#00a8e8)}
  #fc-app .card h3{font-size:.98rem;margin:7px 0 2px}
  #fc-app .card .mod{font-size:.7rem;color:var(--muto);font-weight:600;margin-bottom:5px}
  #fc-app .card p{font-size:.78rem}
  #fc-app .card .go{margin-top:6px;font-weight:700;color:var(--accent);font-size:.78rem}
  #fc-app .foot{flex:0 0 auto;text-align:center;color:var(--muto);font-size:.7rem}

  /* ---- DETTAGLIO ---- */
  #fc-app .top{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  #fc-app .back{background:none;border:none;cursor:pointer;color:var(--blu);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;font-family:inherit;padding:2px 4px}
  #fc-app .back:hover{color:var(--accent)}
  #fc-app .top h2{font-size:clamp(.98rem,1.8vw,1.25rem)}
  #fc-app .top .mod{color:var(--muto);font-weight:600;font-size:.75rem}
  #fc-app .tabs{flex:0 0 auto;display:flex;gap:6px;border-bottom:1px solid var(--bordo)}
  #fc-app .tab{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font:inherit;color:var(--muto);font-weight:700;font-size:.8rem;padding:7px 10px;margin-bottom:-1px}
  #fc-app .tab.on{color:var(--blu);border-bottom-color:var(--accent)}
  #fc-app .stage{flex:1;min-height:0;position:relative}
  #fc-app .pane{position:absolute;inset:0;display:none}
  #fc-app .pane.on{display:block}

  /* pane Panoramica: galleria + info, tutto dentro l'altezza */
  #fc-app .pano{height:100%;display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  @media(max-width:640px){#fc-app .pano{grid-template-columns:1fr;grid-template-rows:1fr auto}}
  #fc-app .gal{min-height:0;display:flex;flex-direction:column;gap:8px}
  #fc-app .gal .main{flex:1;min-height:0}
  #fc-app .gal .thumbs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #fc-app .gal .thumbs .t{height:42px;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;padding:0;background:none}
  #fc-app .gal .thumbs .t.on{border-color:var(--accent)}
  #fc-app .gal .thumbs .t .pz,#fc-app .gal .thumbs .t img{height:100%;border-radius:0}
  #fc-app .side{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #fc-app .side .intro{font-size:.8rem;color:var(--testo);margin-bottom:7px}
  #fc-app .spec{list-style:none;display:grid;gap:4px;margin-bottom:8px}
  #fc-app .spec li{display:flex;gap:7px;align-items:flex-start;font-size:.79rem}
  #fc-app .spec li svg{flex:0 0 14px;margin-top:2px;color:var(--accent)}
  #fc-app .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  #fc-app .chip{display:inline-flex;align-items:center;gap:5px;background:var(--grigio);border:1px solid var(--bordo);color:var(--blu);border-radius:999px;padding:4px 9px;font-size:.68rem;font-weight:600}
  #fc-app .chip svg{color:var(--accent)}

  /* pane Dettagli: griglia di feature che riempie l'area */
  #fc-app .feats{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
  @media(max-width:640px){#fc-app .feats{grid-template-columns:1fr;grid-auto-rows:auto;overflow-y:auto}}
  #fc-app .fcard{min-height:0;border:1px solid var(--bordo);border-radius:11px;background:#fff;box-shadow:0 6px 16px rgba(10,61,98,.08);padding:12px 14px;overflow:hidden}
  #fc-app .fcard h5{font-size:.86rem;color:var(--blu);margin-bottom:4px;display:flex;gap:6px;align-items:center}
  #fc-app .fcard h5 svg{color:var(--accent);flex:0 0 auto}
  #fc-app .fcard p{font-size:.76rem;color:var(--muto);line-height:1.4}

  /* pane Tecnica */
  #fc-app .tec{height:100%;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  #fc-app .tec .tbox{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;border-radius:10px;padding:12px 14px;font-size:.8rem;line-height:1.5;flex:0 0 auto}
  #fc-app .tec .tbox b{color:#bfe9ff}
  #fc-app .tec .twrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--bordo);border-radius:10px;background:#fff}
  #fc-app table.tt{border-collapse:collapse;width:100%;font-size:.72rem}
  #fc-app table.tt th,#fc-app table.tt td{border:1px solid var(--bordo);padding:5px 7px;text-align:center}
  #fc-app table.tt thead th{background:var(--blu);color:#fff;position:sticky;top:0}
  #fc-app table.tt tbody th{background:var(--grigio);color:var(--blu);text-align:left;white-space:nowrap}
  #fc-app .tec .note{flex:0 0 auto;font-size:.7rem;color:var(--muto)}
  </style>

  <!-- HOME -->
  <div class="view home on" data-view="home">
    <div class="kick">Frigo Control Ticino · Mitsubishi Electric</div>
    <h1>Climatizzatori a pavimento</h1>
    <div class="sub">Comfort discreto a livello del suolo, ideale dove non puoi montare l'unità in alto.</div>
    <div class="cards">
      <button class="card sfz" type="button" data-open="sfz">
        <div class="ph pz"><img src="https://frigocontrolch.10web.me/wp-content/uploads/2025/08/climatizzatore-a-pavimento-incasso-soggiorno-frigo-control-ticino-600x449.webp" alt="Unità ad incasso SFZ-M" loading="lazy"></div>
        <div class="bd"><span class="badge">Incasso</span><h3>Unità ad incasso SFZ-M</h3><div class="mod">Serie S</div><p>Si integra nella parete, doppia aspirazione dell'aria e DC Inverter.</p><div class="go">Scopri →</div></div>
      </button>
      <button class="card mfz" type="button" data-open="mfz">
        <div class="ph pz"><img src="https://frigocontrolch.10web.me/wp-content/uploads/2025/08/climatizzatore-a-pavimento-mfz-kt-soggiorno-frigo-control-ticino.webp" alt="A pavimento MFZ-KT" loading="lazy"></div>
        <div class="bd"><span class="badge">A pavimento</span><h3>A pavimento MFZ-KT</h3><div class="mod">Serie M</div><p>Estetica moderna, filtro V Blocking in dotazione e Multi-flow vane.</p><div class="go">Scopri →</div></div>
      </button>
    </div>
    <div class="foot">Sopralluogo gratuito · Installazione e assistenza in Ticino · Refrigerante R32</div>
  </div>

  <div class="view" data-view="sfz" id="v-sfz"></div>
  <div class="view" data-view="mfz" id="v-mfz"></div>

  <script>
  (function(){
    var root=document.getElementById('fc-app');
    if(root.dataset.init) return; root.dataset.init='1';
    var CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    var P={leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
      remote:'<rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="12" r="1.5"/>',
      air:'<path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>',
      vol:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
      floor:'<path d="M3 20h18"/><rect x="6" y="9" width="12" height="8" rx="1"/>',
      therm:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
      wind:'<path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>',
      shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'};
    function sv(p){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
    function ic(t){t=t.toLowerCase();return sv(/r32|refriger/.test(t)?P.leaf:/remoto|controllo/.test(t)?P.remote:/purific|aria|filtro/.test(t)?P.air:/silenz/.test(t)?P.vol:P.floor);}
    var U='https://frigocontrolch.10web.me/wp-content/uploads/';
    var D={
      sfz:{badge:'Incasso',cls:'sfz',titolo:'Unità ad incasso SFZ-M',mod:'Serie S',
        intro:'Si integra nella parete per un risultato pulito e discreto, con doppia aspirazione dell’aria e ventilatore DC Inverter.',
        gallery:[
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-soggiorno-frigo-control-ticino-600x449.webp',c:'In soggiorno moderno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-sfz-m-kit-frigo-control-ticino.webp',c:'Kit interno + esterno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-sfz-m-frigo-control-ticino-600x600.webp',c:'Unità interna'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-soggiorno-moderno-frigo-control-ticino-600x449.webp',c:'Sotto finestra'}
        ],
        spec:['Alta efficienza energetica stagionale','Portata d’aria regolabile (DC Inverter)','Doppia aspirazione dell’aria','Dimensioni super compatte','Gas refrigerante R32','Wi-Fi MELCloud opzionale'],
        chips:['A pavimento','Controllo remoto','Gas R32','Silenziosità'],
        feats:[
          {i:P.floor,t:'Dimensioni compatte',p:'Le ridotte dimensioni rendono idonea l’installazione anche in incassi particolarmente ristretti.'},
          {i:P.wind,t:'Installazione flessibile',p:'Ingresso aria dal basso o dalla parete anteriore, cambiando pannello, griglia e filtro.'},
          {i:P.therm,t:'Alta efficienza',p:'Classe energetica fino ad A++ in raffreddamento e A+ in riscaldamento.'},
          {i:P.wind,t:'Portata d’aria regolabile',p:'Ventilatore DC Inverter: 4 pressioni statiche (0-25-40-60 Pa), da canalizzazioni lunghe a scarico diretto.'},
          {i:P.vol,t:'Comfort acustico',p:'Emissioni sonore ridotte al minimo grazie alla cura costruttiva Mitsubishi Electric.'},
          {i:P.leaf,t:'Gas refrigerante R32',p:'Più efficiente, minor quantità di gas, ridotto impatto ambientale, bassa infiammabilità.'}
        ],
        tecBox:'Sistema <b>monosplit</b> o <b>multisplit</b> (MXZ / MXZ Hyper Heating) · Gas <b>R32</b> · classe fino ad <b>A++</b> in raffreddamento e <b>A+</b> in riscaldamento.',
        table:null, note:'*Classi di efficienza energetica da A+++ a D'
      },
      mfz:{badge:'A pavimento',cls:'mfz',titolo:'A pavimento MFZ-KT',mod:'Serie M',
        intro:'Estetica moderna ed elegante, con filtro purificatore V Blocking in dotazione, sistema Multi-flow vane ed elevata capacità di riscaldamento.',
        gallery:[
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-soggiorno-frigo-control-ticino.webp',c:'In soggiorno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-design-moderno-frigo-control-ticino.webp',c:'Design moderno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-frontale-frigo-control-ticino.webp',c:'Vista frontale'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-dimensioni-frigo-control-ticino.webp',c:'Dimensioni'}
        ],
        spec:['Estetica moderna ed elegante','Filtro V Blocking in dotazione','Sistema Multi-flow vane','Elevata capacità di riscaldamento','Gas refrigerante R32','Elevata silenziosità'],
        chips:['A pavimento','Controllo remoto','Purificazione aria','Gas R32','Silenziosità'],
        feats:[
          {i:P.wind,t:'Multi-flow vane',p:'Tre deflettori ottimizzano la distribuzione dell’aria in raffrescamento e riscaldamento.'},
          {i:P.air,t:'Filtro V Blocking in dotazione',p:'Azione antivirale: inibisce fino al 99% di virus, batteri, muffe e allergeni.'},
          {i:P.air,t:'Filtro standard in dotazione',p:'Rimuove polveri e impurità, con effetto antibatterico, antimuffa e cattura odori.'},
          {i:P.floor,t:'Design a pavimento',p:'Linee semplici e superfici piatte che si abbinano ad ogni arredamento.'}
        ],
        tecBox:'Potenze <b>2,5 – 5,0 kW</b> · Gas <b>R32</b> · mono e multisplit (MXZ / MXZ Hyper Heating / PUMY-SP).',
        table:'<table class="tt"><thead><tr><th>Unità interna</th><th>KT25</th><th>KT35</th><th>KT50</th></tr></thead><tbody>'
          +'<tr><th>Unità esterna</th><td>SUZ-M25VA</td><td>SUZ-M35VA</td><td>SUZ-M50VA</td></tr>'
          +'<tr><th>Raffr. Potenza (kW)</th><td>2,5</td><td>3,5</td><td>5,0</td></tr>'
          +'<tr><th>SEER</th><td>6,5</td><td>6,6</td><td>6,8</td></tr>'
          +'<tr><th>Classe raffr.</th><td>A++</td><td>A++</td><td>A++</td></tr>'
          +'<tr><th>Risc. Potenza (kW)</th><td>2,2</td><td>2,6</td><td>4,3</td></tr>'
          +'<tr><th>SCOP</th><td>4,2</td><td>4,4</td><td>4,2</td></tr>'
          +'<tr><th>Classe risc.</th><td>A+</td><td>A+</td><td>A+</td></tr>'
          +'</tbody></table>',
        note:'*Classi di efficienza energetica da A+++ a D'
      }
    };
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function render(k){
      var d=D[k];
      var thumbs=d.gallery.map(function(g,i){return '<button type="button" class="t'+(i===0?' on':'')+'" data-i="'+i+'"><span class="pz"><img src="'+g.s+'" alt="'+esc(g.c)+'" loading="lazy"></span></button>';}).join('');
      var spec=d.spec.map(function(s){return '<li>'+CK+'<span>'+esc(s)+'</span></li>';}).join('');
      var chips=d.chips.map(function(c){return '<span class="chip">'+ic(c)+esc(c)+'</span>';}).join('');
      var feats=d.feats.map(function(f){return '<div class="fcard"><h5>'+sv(f.i)+esc(f.t)+'</h5><p>'+esc(f.p)+'</p></div>';}).join('');
      var tec='<div class="tbox">'+d.tecBox+'</div>'+(d.table?('<div class="twrap">'+d.table+'</div>'):'')+'<div class="note">'+esc(d.note)+'</div>';
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button>'
        +'<span class="badge '+d.cls+'">'+esc(d.badge)+'</span><h2>'+esc(d.titolo)+'</h2><span class="mod">'+esc(d.mod)+'</span></div>'
        +'<div class="tabs"><button class="tab on" data-tab="0">Panoramica</button><button class="tab" data-tab="1">Dettagli</button><button class="tab" data-tab="2">Scheda tecnica</button></div>'
        +'<div class="stage">'
          +'<div class="pane on" data-pane="0"><div class="pano">'
            +'<div class="gal"><div class="main pz ct"><img id="m-'+k+'" src="'+d.gallery[0].s+'" alt="'+esc(d.gallery[0].c)+'"></div><div class="thumbs" data-th="'+k+'">'+thumbs+'</div></div>'
            +'<div class="side"><div class="intro">'+esc(d.intro)+'</div><ul class="spec">'+spec+'</ul><div class="chips">'+chips+'</div></div>'
          +'</div></div>'
          +'<div class="pane" data-pane="1"><div class="feats">'+feats+'</div></div>'
          +'<div class="pane" data-pane="2"><div class="tec">'+tec+'</div></div>'
        +'</div>';
    }
    document.getElementById('v-sfz').innerHTML=render('sfz');
    document.getElementById('v-mfz').innerHTML=render('mfz');

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ show(op.getAttribute('data-open')); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var tb=e.target.closest('.tab'); if(tb){ var wrap=tb.closest('.view'); var i=tb.getAttribute('data-tab');
        wrap.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===tb);});
        wrap.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-pane')===i);}); return; }
      var th=e.target.closest('.thumbs .t'); if(th){ var row=th.parentNode; var key=row.getAttribute('data-th'); var idx=+th.getAttribute('data-i');
        var g=D[key].gallery[idx]; var m=document.getElementById('m-'+key); m.src=g.s; m.alt=g.c;
        row.querySelectorAll('.t').forEach(function(x){x.classList.remove('on');}); th.classList.add('on'); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });
  })();
  </script>
</div>

<!-- FRIGO CONTROL TEAM CAROUSEL - 4 DESKTOP / 3 TABLET / 1 MOBILE -->
<!-- WIDGET TEAM FRIGO CONTROL — versione compatta (una riga, scroll con frecce) -->
<section class="fc-team" aria-labelledby="fc-team-title">
  <div class="fc-team-shell">
    <header class="fc-team-head">
      <div class="fc-team-titles" id="fc-titoli"></div>

      <div class="fc-team-nav" data-fc-nav hidden>
        <button type="button" class="fc-nav-btn" data-fc-dir="-1" aria-label="Scorri a sinistra">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="fc-nav-btn" data-fc-dir="1" aria-label="Scorri a destra">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="fc-team-track" data-fc-track tabindex="0" role="group" aria-label="Membri del team"></div>
  </div>
</section>

<style>
  .fc-team,
  .fc-team * { box-sizing: border-box; }

  .fc-team {
    --fc-bg: #020318;
    --fc-blue: #175cff;
    --fc-violet: #6951ff;
    --fc-text: #f7f8ff;
    --fc-muted: #b8bdd7;
    --fc-line: rgba(87, 112, 255, 0.34);
    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: 100%;
    padding: clamp(38px, 4.5vw, 64px) 0;
    color: var(--fc-text);
    background:
      radial-gradient(circle at 4% 8%, rgba(41, 76, 255, 0.22), transparent 32%),
      radial-gradient(circle at 96% 92%, rgba(91, 38, 255, 0.18), transparent 36%),
      var(--fc-bg);
    font-family: inherit, Arial, sans-serif;
  }

  .fc-team::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    opacity: 0.3;
    background-image:
      linear-gradient(rgba(78, 103, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78, 103, 255, 0.08) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 82%);
    mask-image: linear-gradient(to bottom, black, transparent 82%);
    pointer-events: none;
  }

  .fc-team-shell {
    width: min(1320px, 100%);
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 28px);
  }

  .fc-team-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: clamp(22px, 2.6vw, 34px);
    padding-bottom: clamp(16px, 2vw, 22px);
    border-bottom: 1px solid var(--fc-line);
  }

  .fc-team-kicker {
    margin: 0 0 8px;
    color: #82a6ff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .fc-team-head h2 {
    margin: 0;
    font-size: clamp(30px, 3.6vw, 46px);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  .fc-team-nav { display: flex; gap: 8px; }
  .fc-team-nav[hidden] { display: none; }

  .fc-nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    color: var(--fc-text);
    border: 1px solid rgba(117, 132, 255, 0.34);
    border-radius: 50%;
    background: rgba(12, 18, 60, 0.9);
    cursor: pointer;
    transition: background 200ms ease, border-color 200ms ease, opacity 200ms ease;
  }

  .fc-nav-btn svg { width: 18px; height: 18px; }

  .fc-nav-btn:hover:not(:disabled) {
    border-color: rgba(99, 127, 255, 0.75);
    background: rgba(23, 92, 255, 0.24);
  }

  .fc-nav-btn:disabled { opacity: 0.3; cursor: default; }

  .fc-nav-btn:focus-visible,
  .fc-team-track:focus-visible {
    outline: 2px solid #82a6ff;
    outline-offset: 3px;
  }

  .fc-team-track {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding-bottom: 4px;
  }

  .fc-team-track::-webkit-scrollbar { display: none; }

  .fc-team-card {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 0 0 calc((100% - 54px) / 4);
    min-width: 0;
    overflow: hidden;
    scroll-snap-align: start;
    border: 1px solid rgba(117, 132, 255, 0.22);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(18, 25, 78, 0.96), rgba(3, 5, 27, 0.98));
    transition: transform 260ms ease, border-color 260ms ease;
  }

  .fc-team-card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--fc-blue), var(--fc-violet));
    transform: scaleX(0.22);
    transform-origin: left;
    transition: transform 260ms ease;
  }

  .fc-team-card:hover { transform: translateY(-5px); border-color: rgba(99, 127, 255, 0.6); }
  .fc-team-card:hover::after { transform: scaleX(1); }

  .fc-team-photo {
    position: relative;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    background: #0b0e2f;
  }

  .fc-team-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(3, 5, 29, 0.7), transparent 46%);
    pointer-events: none;
  }

  .fc-team-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: saturate(0.9) contrast(1.04);
    transition: transform 550ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .fc-team-card:hover .fc-team-photo img { transform: scale(1.04); }

  .fc-team-content {
    flex: 1;
    padding: 16px 16px 20px;
  }

  .fc-team-role {
    margin: 0 0 6px;
    color: #7fa4ff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.09em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  .fc-team-content h3 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .fc-team-desc {
    margin: 0;
    color: var(--fc-muted);
    font-size: 13px;
    line-height: 1.5;
  }

  @media (max-width: 900px) {
    .fc-team-card {
      flex: 0 0 calc((100% - 36px) / 3);
    }
  }

  @media (max-width: 640px) {
    .fc-team { padding: 34px 0 40px; }
    .fc-team-card {
      flex: 0 0 82%;
      min-width: 0;
    }
    .fc-team-desc { font-size: 12.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fc-team-track { scroll-behavior: auto; }
    .fc-team-card,
    .fc-team-card::after,
    .fc-team-photo img { transition: none; }
  }
</style>

<!--FC-KIT-->
<script>
(function () {
  var E = FCKit.esc;
  var DATI = {"kicker":"Le persone dietro ogni impianto","titolo":"Il nostro team","persone":[{"nome":"Walter Meyerhans","ruolo":"Fondatore · Responsabile operativo","descrizione":"Tecnico frigorista AFC. Dal 2008 guida l’azienda con esperienza e conoscenza del territorio.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/d61701d60dcfcb99.webp"},{"nome":"Daniele Meyerhans","ruolo":"Montaggi clima · Magazzino","descrizione":"Tecnico frigorista AFC. Coordina i montaggi clima e la gestione del magazzino.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/37877d0da7a4d41c.webp"},{"nome":"Fabrizio Affinito","ruolo":"Responsabile manutenzioni","descrizione":"Tecnico frigorista. Mantiene ogni impianto efficiente e riduce i fermi nel tempo.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/0ed76e6ffa629a71.webp"},{"nome":"Fabio Polizzi","ruolo":"Responsabile di progetto","descrizione":"Tecnico frigorista. Segue ogni intervento dall’inizio alla fine.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/e2a96a9586757d2b.webp"},{"nome":"Mithuran Pushprasa","ruolo":"Riparazioni · Apprendisti","descrizione":"Tecnico frigorista AFC. Gestisce le riparazioni e la crescita degli apprendisti.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/6c2ebab93dbd78bd.webp"},{"nome":"Edi Dushica","ruolo":"Apprendista 3° anno","descrizione":"Cresce sul campo al fianco dei nostri tecnici.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/c5e89b89099a40f4.webp"},{"nome":"Rayan Tawfeek","ruolo":"Apprendista 2° anno","descrizione":"Muove i primi passi tra installazioni e assistenza.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/ed815e80e8b95317.webp"},{"nome":"Natalia Nahorna","ruolo":"Amministrazione · CRM","descrizione":"Cura amministrazione, CRM e rapporto con i clienti.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/1286cd0b6bd9994f.webp"},{"nome":"Anna Meyerhans","ruolo":"Finanze e Marketing","descrizione":"Cura organizzazione, amministrazione e comunicazione.","foto":"https://dgvrlpubiuqxsvkjtrdh.supabase.co/storage/v1/object/public/media/incorporate/ef343f9d83f9c8ac.webp"}]};
  var SCHEMA = [
    { t: "testo", k: "kicker", l: "Scritta piccola sopra il titolo" },
    { t: "testo", k: "titolo", l: "Titolo" },
    { t: "lista", k: "persone", l: "Persone del team", agg: "Aggiungi una persona", titolo: "nome", miniatura: "foto", min: 1,
      aiuto: "Per l'ordine usa le frecce ↑ ↓. Le foto vengono ritagliate in automatico.",
      nuovo: { nome: "", ruolo: "", descrizione: "", foto: "" },
      voce: { t: "gruppo", campi: [
        { t: "testo", k: "nome", l: "Nome e cognome" },
        { t: "testo", k: "ruolo", l: "Ruolo" },
        { t: "area", k: "descrizione", l: "Descrizione" },
        { t: "img", k: "foto", l: "Foto", aiuto: "Meglio quadrata, almeno 700×700 pixel." }
      ] } }
  ];
  var track = document.querySelector("[data-fc-track]");
  var nav = document.querySelector("[data-fc-nav]");
  var buttons = nav.querySelectorAll("[data-fc-dir]");

  function update() {
    var scrollable = track.scrollWidth - track.clientWidth > 4;
    nav.hidden = !scrollable;
    if (!scrollable) return;
    buttons[0].disabled = track.scrollLeft <= 2;
    buttons[1].disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2;
  }
  Array.prototype.forEach.call(buttons, function (btn) {
    btn.addEventListener("click", function () {
      var dir = Number(btn.getAttribute("data-fc-dir"));
      var card = track.querySelector(".fc-team-card");
      if (!card) return;
      var gap = parseFloat(getComputedStyle(track).gap) || 0;
      var step = card.getBoundingClientRect().width + gap;
      track.scrollBy({ left: dir * step, behavior: "smooth" });
    });
  });
  track.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update);
  window.addEventListener("load", update);

  function render(d) {
    document.getElementById("fc-titoli").innerHTML =
      '<p class="fc-team-kicker">' + E(d.kicker) + '</p><h2 id="fc-team-title">' + E(d.titolo) + "</h2>";
    track.innerHTML = (d.persone || []).map(function (p, i) {
      return '<article class="fc-team-card"><div class="fc-team-photo"><img src="' + E(p.foto) + '" alt="' + E(p.nome + ", " + p.ruolo) +
        '" width="720" height="720"' + (i ? ' loading="lazy"' : "") + '></div><div class="fc-team-content"><p class="fc-team-role">' + E(p.ruolo) +
        "</p><h3>" + E(p.nome) + '</h3><p class="fc-team-desc">' + E(p.descrizione) + "</p></div></article>";
    }).join("");
    update();
  }
  FCKit.avvia({ id: "home-team", nome: "Home · Il nostro team (carosello)", dati: DATI, schema: SCHEMA, render: render,
                ingranaggio: { pos: "br", tono: "scuro" } });
})();
</script>

    ".fck-tab th input{font-weight:700;background:var(--fg)}",
    ".fck-tab tr.fck-tg input{font-weight:700;background:#e3eefa}",
    ".fck-tab .fck-tc{white-space:nowrap;width:1%}",
    ".fck-tab .fck-tc .fck-ic{width:24px;height:24px;font-size:12px;margin:0 1px}",
    ".fck-trow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}",
    ".fck-trow .fck-b{padding:7px 10px;font-size:12px}",

    ".fck-dlg>div{background:#fff;border-radius:12px;max-width:420px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}",
    ".fck-dlg p{margin:0 0 14px}.fck-dlg .fck-az{justify-content:flex-end}",
    ".fck-ver{max-width:620px;margin:0 auto}",
    ".fck-ver h3{margin:0 0 4px;font-size:16px;color:var(--fb)}.fck-ver>p{margin:0 0 12px;color:var(--fm);font-size:13px}",
    ".fck-vi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1.5px solid var(--fl);border-radius:10px;background:#fff;margin:0 0 6px}",
    "@media (max-width:560px){.fck-head{padding:8px 10px}.fck-b{padding:8px 10px;font-size:12px}.fck-corpo{padding:10px}}"
  ].join("\n");

  function stile(doc) {
    if (doc.getElementById("fck-stile")) return;
    var s = doc.createElement("style"); s.id = "fck-stile"; s.textContent = CSS;
    (doc.head || doc.documentElement).appendChild(s);
  }

  /* ── valore predefinito di una voce nuova ────────────────────────────── */
  function vuoto(f) {
    if (!f) return "";
    if (f.nuovo !== undefined) return clona(typeof f.nuovo === "function" ? f.nuovo() : f.nuovo);
    if (f.t === "gruppo") { var o = {}; (f.campi || []).forEach(function (c) { if (c.k) o[c.k] = vuoto(c); else if (c.t === "gruppo") { var x = vuoto(c); for (var z in x) o[z] = x[z]; } }); return o; }
    if (f.t === "lista") return [];
    if (f.t === "tabella") return { intestazioni: ["", ""], righe: [] };
    if (f.t === "num") return 0;
    if (f.t === "si") return false;
    if (f.t === "sel") return f.opz && f.opz[0] ? f.opz[0][0] : "";
    return "";
  }

  /* ═══════════════════════════════════════════════════════════════════════
     MODULO DI MODIFICA (costruito dentro il documento ospite: iframe o finestra)
     ═══════════════════════════════════════════════════════════════════════ */
  function Editor(st, doc, box, chiudi) {
    var win = doc.defaultView || window;
    function el(tag, cls, html) {
      var e = doc.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    }
    function btn(cls, html, titolo) {
      var b = el("button", cls, html); b.type = "button"; if (titolo) b.title = titolo; return b;
    }

    box.innerHTML = "";
    var pan = el("div", "fck-pan"); box.appendChild(pan);
    var head = el("div", "fck-head"); pan.appendChild(head);
    head.appendChild(el("div", "fck-tit", "<b>Modifica contenuti</b><span>" + esc(st.cfg.nome) + "</span>"));
    var azioni = el("div", "fck-az"); head.appendChild(azioni);
    var bx = btn("fck-b fck-x", "×", "Chiudi"); head.appendChild(bx);
    var corpo = el("div", "fck-corpo"); pan.appendChild(corpo);
    var piede = el("div", "fck-piede"); pan.appendChild(piede);
    var msg = el("span", "fck-msg"); piede.appendChild(msg);
    var bEsci = btn("fck-b", "Esci", "Esci dal menu impostazioni"); bEsci.style.display = "none"; piede.appendChild(bEsci);

    var sporco = false;
    function info(h) { msg.innerHTML = h || ""; }
    function stato() {
      return ATTIVO ? '<span class="fck-ok">●</span> Database collegato'
                    : '<span class="fck-warn">●</span> Modalità locale: database non collegato, le modifiche restano un\'anteprima';
    }

    /* finestra di conferma interna (le finestre native possono essere bloccate da Wix) */
    function chiedi(testo, si, no) {
      return new Promise(function (ok) {
        var d = el("div", "fck-dlg"), c = el("div");
        c.appendChild(el("p", null, esc(testo)));
        var az = el("div", "fck-az");
        var bn = btn("fck-b", esc(no || "Annulla")), bs = btn("fck-b fck-prim", esc(si || "Conferma"));
        az.appendChild(bn); az.appendChild(bs); c.appendChild(az); d.appendChild(c); pan.appendChild(d);
        bn.onclick = function () { d.remove(); ok(false); };
        bs.onclick = function () { d.remove(); ok(true); };
        setTimeout(function () { bs.focus(); }, 30);
      });
    }

    bx.onclick = function () {
      if (!sporco) return chiudi();
      chiedi("Ci sono modifiche non salvate. Chiudere senza salvare?", "Chiudi senza salvare", "Resta").then(function (s) { if (s) chiudi(); });
    };
    bEsci.onclick = function () {
      function esci() { pwdScrivi(""); st.pwd = ""; sporco = false; vistaLogin(); }
      if (!sporco) return esci();
      chiedi("Ci sono modifiche non salvate. Uscire senza salvare?", "Esci", "Resta").then(function (s) { if (s) esci(); });
    };

    /* ── accesso ── */
    function vistaLogin(errore) {
      azioni.innerHTML = ""; corpo.innerHTML = ""; bEsci.style.display = "none";
      var f = el("form", "fck-login");
      f.innerHTML = '<div class="fck-lucch">' + IC.lock + "</div>" +
        "<p>Inserisci la password per modificare questa sezione del sito.</p>" +
        '<input type="password" autocomplete="current-password" placeholder="Password">' +
        '<div class="fck-err">' + esc(errore || "") + "</div>" +
        '<button class="fck-b fck-prim" type="submit">Entra</button>' +
        (ATTIVO ? "" : '<p class="fck-nota">Il database non è ancora collegato: puoi provare le modifiche in anteprima, ma non verranno pubblicate per gli altri visitatori.</p>');
      corpo.appendChild(f);
      var inp = f.querySelector("input"), err = f.querySelector(".fck-err"), bt = f.querySelector("button");
      setTimeout(function () { inp.focus(); }, 60);
      f.onsubmit = function (e) {
        e.preventDefault();
        var p = inp.value; if (!p) return;
        bt.disabled = true; err.textContent = ""; info("Verifica in corso…");
        verifica(p).then(function (ok) {
          bt.disabled = false;
          if (ok) { pwdScrivi(p); st.pwd = p; vistaEditor(); }
          else { err.textContent = "Password errata"; inp.value = ""; inp.focus(); info(stato()); }
        }).catch(function (e2) { bt.disabled = false; err.textContent = "Connessione non riuscita (" + e2.message + ")"; info(stato()); });
      };
      info(stato());
    }

    /* ── editor ── */
    var bozza;
    function vistaEditor() {
      bozza = clona(st.dati); sporco = false;
      azioni.innerHTML = ""; bEsci.style.display = "";
      var bVer = btn("fck-b", "Versioni", "Versioni precedenti e contenuto originale");
      var bAnn = btn("fck-b", "Annulla modifiche", "Torna all'ultima versione pubblicata");
      var bSal = btn("fck-b fck-prim", ATTIVO ? "Salva e pubblica" : "Applica anteprima");
      azioni.appendChild(bVer); azioni.appendChild(bAnn); azioni.appendChild(bSal);

      function segna() {
        if (!sporco) { sporco = true; bSal.classList.add("fck-pulse"); }
        info('<span class="fck-warn">●</span> Modifiche non ancora salvate');
      }
      function disegna() {
        corpo.innerHTML = "";
        var form = el("div", "fck-form"); corpo.appendChild(form);
        campi(st.cfg.schema, bozza, form);
      }
      var ctx = { segna: segna };

      /* — campi — */
      function campi(lista, obj, cont) { lista.forEach(function (f) { campo(f, obj, cont); }); }
      function campo(f, obj, cont) {
        if (f.t === "gruppo") {
          var tgt = obj;
          if (f.k) { if (!obj[f.k] || typeof obj[f.k] !== "object") obj[f.k] = vuoto(f); tgt = obj[f.k]; }
          var g = el("fieldset", "fck-gr");
          if (f.l) g.appendChild(el("legend", null, esc(f.l)));
          if (f.aiuto) g.appendChild(el("p", "fck-aiuto", esc(f.aiuto)));
          campi(f.campi, tgt, g); cont.appendChild(g); return;
        }
        if (f.t === "lista") return lista(f, obj, cont);
        if (f.t === "tabella") return tabella(f, obj, cont);
        if (obj[f.k] === undefined) obj[f.k] = vuoto(f);
        var w = el("div", "fck-f");
        w.appendChild(el("span", "fck-l", esc(f.l) + (f.aiuto ? "<em>" + esc(f.aiuto) + "</em>" : "")));
        w.appendChild(input(f, function () { return obj[f.k]; }, function (v) { obj[f.k] = v; }));
        cont.appendChild(w);
      }
      function input(f, get, set) {
        var i;
        if (f.t === "img") return immagine(f, get, set);
        if (f.t === "area") {
          i = el("textarea"); i.rows = f.righe || 3; i.value = get() == null ? "" : get();
          i.oninput = function () { set(i.value); ctx.segna(); };
          return i;
        }
        if (f.t === "sel") {
          i = el("select");
          (f.opz || []).forEach(function (o) { var op = el("option", null, esc(o[1])); op.value = o[0]; i.appendChild(op); });
          i.value = get(); if (i.value !== get() && f.opz && f.opz[0]) { i.value = f.opz[0][0]; }
          i.onchange = function () { set(i.value); ctx.segna(); };
          return i;
        }
        if (f.t === "si") {
          var lab = el("label", null); i = el("input"); i.type = "checkbox"; i.style.width = "auto"; i.checked = !!get();
          i.onchange = function () { set(i.checked); ctx.segna(); };
          lab.appendChild(i); lab.appendChild(doc.createTextNode(" " + (f.testo || "Sì"))); return lab;
        }
        i = el("input"); i.type = f.t === "num" ? "number" : f.t === "link" ? "url" : "text";
        if (f.ph) i.placeholder = f.ph;
        i.value = get() == null ? "" : get();
        i.oninput = function () { set(f.t === "num" ? (i.value === "" ? 0 : Number(i.value)) : i.value); ctx.segna(); };
        return i;
      }
      function immagine(f, get, set) {
        var w = el("div", "fck-img");
        var th = el("div", "fck-th"); w.appendChild(th);
        var iw = el("div", "fck-iw"); w.appendChild(iw);
        var url = el("input"); url.type = "url";
        function mostraUrl() {
          var v = get() || "", dentro = /^data:/.test(v);
          url.value = dentro ? "" : v;
          url.placeholder = dentro ? "Foto incorporata nel codice — per cambiarla carica una foto o incolla un indirizzo"
                                   : "Indirizzo dell'immagine (https://…)";
        }
        mostraUrl();
        var ir = el("div", "fck-ir");
        var bc = btn("fck-b", "Carica foto dal computer");
        var fi = el("input"); fi.type = "file"; fi.accept = "image/*"; fi.style.display = "none";
        ir.appendChild(bc); ir.appendChild(fi);
        iw.appendChild(url); iw.appendChild(ir);
        var nota = el("span", "fck-aiuto"); iw.appendChild(nota);
        function anteprima() { var v = get(); th.style.backgroundImage = v ? 'url("' + String(v).replace(/"/g, "%22") + '")' : "none"; }
        anteprima();
        url.oninput = function () { if (!url.value.trim() && /^data:/.test(get() || "")) return; set(url.value.trim()); anteprima(); ctx.segna(); };
        bc.onclick = function () { fi.click(); };
        fi.onchange = function () {
          var file = fi.files && fi.files[0]; fi.value = "";
          if (!file) return;
          if (!/^image\//.test(file.type)) { nota.innerHTML = '<span class="fck-errc">Il file scelto non è un\'immagine.</span>'; return; }
          bc.disabled = true; nota.textContent = "Ottimizzazione e caricamento…";
          ottimizza(file).then(function (o) {
            if (!ATTIVO) {
              return new Promise(function (ok) {
                var r = new FileReader(); r.onload = function () { ok(r.result); }; r.readAsDataURL(o.blob);
              }).then(function (du) { nota.innerHTML = '<span class="fck-warn">Anteprima locale: la foto verrà caricata davvero quando il database sarà collegato.</span>'; return du; });
            }
            return caricaFile(o.blob, st.cfg.id, o.est, o.tipo).then(function (u) { nota.innerHTML = '<span class="fck-ok">Foto caricata ✓</span> ricordati di premere <b>Salva e pubblica</b>.'; return u; });
          }).then(function (u) {
            set(u); mostraUrl(); anteprima(); ctx.segna(); bc.disabled = false;
          }).catch(function (e) { bc.disabled = false; nota.innerHTML = '<span class="fck-errc">Errore: ' + esc(e.message) + "</span>"; });
        };
        return w;
      }

      /* — liste — */
      function lista(f, obj, cont) {
        if (!Array.isArray(obj[f.k])) obj[f.k] = [];
        var arr = obj[f.k];
        var box2 = el("div", "fck-lista");
        var hd = el("div", "fck-lh", "<span>" + esc(f.l) + "<i></i></span>");
        box2.appendChild(hd);
        if (f.aiuto) box2.appendChild(el("p", "fck-aiuto", esc(f.aiuto)));
        var items = el("div"); box2.appendChild(items);
        var add = btn("fck-b fck-add", "+ " + esc(f.agg || "Aggiungi")); box2.appendChild(add);
        var aperti = arr.map(function () { return false; });
        var primitivo = !f.voce || f.voce.t !== "gruppo";

        function etichetta(it, i) {
          var t = "";
          if (typeof f.titolo === "function") t = f.titolo(it, i);
          else if (f.titolo && it && typeof it === "object") t = it[f.titolo];
          else if (typeof it === "string" && (!f.voce || f.voce.t !== "img")) t = it;
          t = String(t == null ? "" : t).replace(/\*\*/g, "").trim();
          return t || "(senza titolo)";
        }
        function miniatura(it) {
          var u = f.miniatura ? (typeof f.miniatura === "function" ? f.miniatura(it) : it && it[f.miniatura]) : (f.voce && f.voce.t === "img" ? it : "");
          return u ? '<img alt="" src="' + esc(u) + '">' : "";
        }
        function disegna() {
          items.innerHTML = "";
          hd.querySelector("i").textContent = arr.length;
          add.disabled = !!(f.max && arr.length >= f.max);
          arr.forEach(function (it, i) {
            var c = el("div", "fck-it" + (aperti[i] ? " fck-on" : ""));
            var h = el("div", "fck-ih");
            var t = el("span", "fck-it-t");
            function titola() { t.innerHTML = "<small>" + (i + 1) + ".</small>" + esc(etichetta(arr[i], i)); }
            titola();
            h.appendChild(el("span", "fck-car", IC.apri));
            var mi = miniatura(it); if (mi) h.insertAdjacentHTML("beforeend", mi);
            h.appendChild(t);
            var bs = btn("fck-ic", IC.su, "Sposta su"), bg = btn("fck-ic", IC.giu, "Sposta giù"),
                bd = btn("fck-ic", IC.dup, "Duplica"), be = btn("fck-ic fck-icdel", IC.del, "Elimina");
            bs.disabled = i === 0; bg.disabled = i === arr.length - 1;
            if (f.max && arr.length >= f.max) bd.disabled = true;
            if (f.min && arr.length <= f.min) be.disabled = true;
            [bs, bg, bd, be].forEach(function (b) { h.appendChild(b); });
            c.appendChild(h);
            var b = el("div", "fck-ib");
            if (primitivo) {
              var w = el("div", "fck-f");
              w.appendChild(input(f.voce || { t: "testo" }, function () { return arr[i]; }, function (v) { arr[i] = v; }));
              b.appendChild(w);
            } else {
              campi(f.voce.campi, arr[i], b);
            }
            b.addEventListener("input", titola); b.addEventListener("change", titola);
            c.appendChild(b);
            h.onclick = function (e) {
              if (e.target.closest("button")) return;
              aperti[i] = !aperti[i]; c.classList.toggle("fck-on", aperti[i]);
            };
            function scambia(a, z) {
              var x = arr[a]; arr[a] = arr[z]; arr[z] = x;
              var y = aperti[a]; aperti[a] = aperti[z]; aperti[z] = y;
              ctx.segna(); disegna();
            }
            bs.onclick = function () { scambia(i, i - 1); };
            bg.onclick = function () { scambia(i, i + 1); };
            bd.onclick = function () { arr.splice(i + 1, 0, clona(arr[i])); aperti.splice(i + 1, 0, true); ctx.segna(); disegna(); };
            be.onclick = function () {
              chiedi('Eliminare "' + etichetta(arr[i], i) + '"?', "Elimina").then(function (s) {
                if (!s) return; arr.splice(i, 1); aperti.splice(i, 1); ctx.segna(); disegna();
              });
            };
            items.appendChild(c);
          });
        }
        add.onclick = function () {
          arr.push(vuoto(f.voce ? (primitivo ? f.voce : f.voce) : { t: "testo" }));
          if (f.nuovo !== undefined) arr[arr.length - 1] = clona(typeof f.nuovo === "function" ? f.nuovo() : f.nuovo);
          aperti.push(true); ctx.segna(); disegna();
        };
        disegna();
        cont.appendChild(box2);
      }

      /* — tabelle: {intestazioni:[…], righe:[{gruppo:"…"} | {celle:[…]}]} — */
      function tabella(f, obj, cont) {
        if (!obj[f.k] || typeof obj[f.k] !== "object") obj[f.k] = { intestazioni: ["", ""], righe: [] };
        var tb = obj[f.k];
        if (!Array.isArray(tb.intestazioni)) tb.intestazioni = [];
        if (!Array.isArray(tb.righe)) tb.righe = [];
        var wrap = el("div", "fck-lista");
        wrap.appendChild(el("div", "fck-lh", "<span>" + esc(f.l) + "</span>"));
        if (f.aiuto) wrap.appendChild(el("p", "fck-aiuto", esc(f.aiuto)));
        var tw = el("div", "fck-tw"); wrap.appendChild(tw);
        var bar = el("div", "fck-trow"); wrap.appendChild(bar);
        var bR = btn("fck-b", "+ Riga"), bG = btn("fck-b", "+ Riga titolo"), bC = btn("fck-b", "+ Colonna"), bCm = btn("fck-b", "− Ultima colonna");
        [bR, bG, bC, bCm].forEach(function (b) { bar.appendChild(b); });
        function cella(get, set) {
          var i = el("input"); i.type = "text"; i.value = get() == null ? "" : get();
          i.oninput = function () { set(i.value); ctx.segna(); };
          return i;
        }
        function disegna() {
          var n = tb.intestazioni.length;
          var t = el("table", "fck-tab");
          var tr = el("tr");
          tb.intestazioni.forEach(function (_, c) {
            var th = el("th"); th.appendChild(cella(function () { return tb.intestazioni[c]; }, function (v) { tb.intestazioni[c] = v; })); tr.appendChild(th);
          });
          tr.appendChild(el("th", "fck-tc")); t.appendChild(tr);
          tb.righe.forEach(function (r, ri) {
            var row = el("tr", r.gruppo !== undefined ? "fck-tg" : "");
            if (r.gruppo !== undefined) {
              var td = el("td"); td.colSpan = n;
              td.appendChild(cella(function () { return r.gruppo; }, function (v) { r.gruppo = v; }));
              row.appendChild(td);
            } else {
              if (!Array.isArray(r.celle)) r.celle = [];
              for (var c = 0; c < n; c++) (function (c) {
                var td2 = el(c === 0 ? "th" : "td");
                td2.appendChild(cella(function () { return r.celle[c]; }, function (v) { r.celle[c] = v; }));
                row.appendChild(td2);
              })(c);
            }
            var tc = el("td", "fck-tc");
            var bs = btn("fck-ic", IC.su, "Sposta su"), bg = btn("fck-ic", IC.giu, "Sposta giù"), be = btn("fck-ic fck-icdel", IC.del, "Elimina riga");
            bs.disabled = ri === 0; bg.disabled = ri === tb.righe.length - 1;
            bs.onclick = function () { var x = tb.righe[ri]; tb.righe[ri] = tb.righe[ri - 1]; tb.righe[ri - 1] = x; ctx.segna(); disegna(); };
            bg.onclick = function () { var x = tb.righe[ri]; tb.righe[ri] = tb.righe[ri + 1]; tb.righe[ri + 1] = x; ctx.segna(); disegna(); };
            be.onclick = function () { chiedi("Eliminare questa riga della tabella?", "Elimina").then(function (s) { if (s) { tb.righe.splice(ri, 1); ctx.segna(); disegna(); } }); };
            tc.appendChild(bs); tc.appendChild(bg); tc.appendChild(be); row.appendChild(tc);
            t.appendChild(row);
          });
          tw.innerHTML = ""; tw.appendChild(t);
          bCm.disabled = n <= 1;
        }
        bR.onclick = function () { tb.righe.push({ celle: tb.intestazioni.map(function () { return ""; }) }); ctx.segna(); disegna(); };
        bG.onclick = function () { tb.righe.push({ gruppo: "Nuovo gruppo" }); ctx.segna(); disegna(); };
        bC.onclick = function () { tb.intestazioni.push(""); tb.righe.forEach(function (r) { if (r.celle) r.celle.push(""); }); ctx.segna(); disegna(); };
        bCm.onclick = function () {
          chiedi("Eliminare l'ultima colonna della tabella?", "Elimina").then(function (s) {
            if (!s) return; tb.intestazioni.pop(); tb.righe.forEach(function (r) { if (r.celle) r.celle.pop(); }); ctx.segna(); disegna();
          });
        };
        disegna();
        cont.appendChild(wrap);
      }

      /* — azioni — */
      bAnn.onclick = function () {
        if (!sporco) { info("Nessuna modifica da annullare"); return; }
        chiedi("Annullare tutte le modifiche non salvate?", "Annulla le modifiche", "No").then(function (s) {
          if (!s) return; bozza = clona(st.dati); sporco = false; bSal.classList.remove("fck-pulse"); disegna(); info(stato());
        });
      };
      bSal.onclick = function () {
        /* prova il nuovo contenuto sul widget prima di pubblicarlo */
        try { st.cfg.render(clona(bozza)); }
        catch (e) {
          try { st.cfg.render(clona(st.dati)); } catch (e2) {}
          info('<span class="fck-errc">● Il contenuto non è valido (' + esc(e.message) + "): non è stato salvato.</span>");
          return;
        }
        if (!ATTIVO) {

    var SCHEMA=[
      {t:'gruppo',k:'home',l:'Schermata iniziale',campi:[
        {t:'testo',k:'kick',l:'Scritta piccola in alto'},
        {t:'testo',k:'titolo',l:'Titolo'},
        {t:'area',k:'sub',l:'Sottotitolo'},
        {t:'testo',k:'foot',l:'Riga in fondo'},
        {t:'testo',k:'badge',l:'Etichetta del marchio',aiuto:'La scritta piccola colorata sulle card e accanto al nome della gamma.'},
        {t:'testo',k:'titoloCarat',l:'Titolo dell\'elenco caratteristiche dei modelli'},
        {t:'testo',k:'titoloVant',l:'Titolo dell\'elenco vantaggi delle gamme'}]},
      {t:'lista',k:'famiglie',l:'Tipi di ghiaccio (una card ciascuno)',agg:'Aggiungi un tipo di ghiaccio',titolo:'name',miniatura:'card',min:1,

          {t:'lista',k:'models',l:'Macchine / modelli',agg:'Aggiungi un modello',titolo:'name',miniatura:'img',min:1,
            aiuto:'Ogni modello è un pulsante nella pagina; ha una sola foto.',
            nuovo:{name:'',img:'',text:'',feats:[]},
            voce:{t:'gruppo',campi:[
              {t:'testo',k:'name',l:'Nome del modello'},
              {t:'img',k:'img',l:'Foto'},
              {t:'area',k:'text',l:'Descrizione del modello',aiuto:'Facoltativa: se resta vuota non compare.'},
              {t:'lista',k:'feats',l:'Caratteristiche (elenco con spunte)',agg:'Aggiungi una caratteristica',voce:{t:'testo',l:'Caratteristica'},
                aiuto:'Se l\'elenco è vuoto, il titolo non compare.'}
            ]}},
          {t:'lista',k:'vant',l:'Vantaggi di questo ghiaccio (elenco con spunte)',agg:'Aggiungi un vantaggio',voce:{t:'testo',l:'Vantaggio'},
            aiuto:'Compaiono sotto le caratteristiche di ogni modello.'}
        ]}}
    ];

    var FAM={}, ORDER=[], cur={}, TX={};

    function renderFam(k){
      var f=FAM[k];
      var chips=f.models.map(function(m,i){return '<button class="mchip'+(i===0?' on':'')+'" type="button" data-i="'+i+'">'+esc(m.name)+'</button>';}).join('');
      var vant=f.vant&&f.vant.length?'<h6 class="eyer">'+esc(TX.titoloVant)+'</h6><ul class="blist">'+f.vant.map(function(x){return '<li>'+CK+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>':'';
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button><span class="badge">'+esc(TX.badge)+'</span><h2>'+esc(f.name)+'</h2></div>'
        +'<div class="fdesc">'+esc(f.desc)+'</div>'
        +'<div class="modelbar" data-fam="'+k+'">'+chips+'</div>'
        +'<div class="fbody">'
          +'<div class="gal"><div class="main pz ct"><img id="gm-'+k+'"></div></div>'
          +'<div class="fspec"><h5 id="mn-'+k+'"></h5><div id="fs-'+k+'"></div>'+vant+'</div>'
        +'</div>';
    }

    function setModel(k,i){
      var f=FAM[k],m=f&&f.models[i]; if(!m) return;
      document.getElementById('mn-'+k).textContent=m.name;
      var html='';
      if(m.text) html+='<p class="mtext">'+esc(m.text)+'</p>';
      if(m.feats.length) html+='<h6 class="eyer">'+esc(TX.titoloCarat)+'</h6><ul class="blist">'+m.feats.map(function(x){return '<li>'+CK+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>';
      document.getElementById('fs-'+k).innerHTML=html;
      var gm=document.getElementById('gm-'+k); gm.src=m.img||''; gm.alt=m.name;
      var bar=document.querySelector('.modelbar[data-fam="'+k+'"]');
      if(bar) bar.querySelectorAll('.mchip').forEach(function(c,ci){c.classList.toggle('on',ci===i);});
      var fs=document.querySelector('#v-'+k+' .fspec'); if(fs) fs.scrollTop=0;
    }

    /* disegna tutto a partire dai dati */
    function render(d){
      FAM={}; ORDER=[]; cur={}; TX=d.home||{};
      d.famiglie.forEach(function(f,i){ var k='f'+i; FAM[k]=f; ORDER.push(k); });
      document.getElementById('fc-kick').textContent=TX.kick;
      document.getElementById('fc-titolo').textContent=TX.titolo;
      document.getElementById('fc-sub').textContent=TX.sub;
      document.getElementById('fc-foot').textContent=TX.foot;
      /* home cards */
      document.getElementById('cards').innerHTML=ORDER.map(function(k){var f=FAM[k];
        return '<button class="card" type="button" data-open="'+k+'"><div class="ph"><div class="pz ct"><img src="'+esc(f.card)+'" alt="'+esc(f.name)+'" loading="lazy"></div></div>'
          +'<div class="bd"><span class="badge">'+esc(TX.badge)+'</span><h3>'+esc(f.name)+'</h3><p>'+esc(f.tag)+'</p><div class="go">Scopri →</div></div></button>';
      }).join('');
      /* viste delle gamme */
      root.querySelectorAll('.view:not(.home)').forEach(function(v){v.remove();});
      var fine=root.querySelector('script');
      ORDER.forEach(function(k){
        var v=document.createElement('div'); v.className='view'; v.setAttribute('data-view',k); v.id='v-'+k;
        v.innerHTML=renderFam(k); root.insertBefore(v,fine);
      });
      ORDER.forEach(function(k){ setModel(k,0); });
      show('home');
    }

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ var v=op.getAttribute('data-open'); show(v); setModel(v,0); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var mc=e.target.closest('.mchip'); if(mc){ var k=mc.closest('.modelbar').getAttribute('data-fam'); setModel(k,+mc.getAttribute('data-i')); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });

    FCKit.avvia({id:'macchine-del-ghiaccio',nome:'Macchine del ghiaccio',dati:DATI,schema:SCHEMA,render:render,ingranaggio:{pos:'br',tono:'chiaro'}});
  })();

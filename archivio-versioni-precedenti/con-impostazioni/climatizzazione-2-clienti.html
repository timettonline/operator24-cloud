<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #080a24;
      font-family: Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .fc-clienti {
      width: 100%;
      background:
        radial-gradient(
          circle at 20% 40%,
          rgba(23, 92, 255, 0.16),
          transparent 38%
        ),
        radial-gradient(
          circle at 80% 60%,
          rgba(50, 70, 180, 0.12),
          transparent 42%
        ),
        #080a24;

      padding: 65px 0 70px;
      text-align: center;
      overflow: hidden;
    }

    .fc-clienti-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* TITOLO */

    .fc-clienti h2 {
      margin: 0 20px 14px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 600;
      color: #ffffff;
    }

    /* TESTO */

    .fc-clienti-intro {
      max-width: 760px;
      margin: 0 auto 42px;
      padding: 0 20px;

      font-family: Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 400;
      color: #eeeeee;
    }

    /* CONTENITORE MARQUEE */

    .fc-marquee {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .fc-marquee::before,
    .fc-marquee::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 110px;
      z-index: 3;
      pointer-events: none;
    }

    .fc-marquee::before {
      left: 0;
      background: linear-gradient(
        90deg,
        #080a24 0%,
        rgba(8, 10, 36, 0) 100%
      );
    }

    .fc-marquee::after {
      right: 0;
      background: linear-gradient(
        270deg,
        #080a24 0%,
        rgba(8, 10, 36, 0) 100%
      );
    }

    .fc-marquee-track {
      display: flex;
      width: max-content;
      animation: fc-scroll calc(32s * var(--fc-k, 1)) linear infinite;
      will-change: transform;
    }

    .fc-marquee-group {
      display: flex;
      align-items: center;
      gap: 24px;
      padding-right: 24px;
    }

    /* SINGOLO LOGO */

    .fc-logo-box {
      width: 220px;
      height: 95px;

      flex: 0 0 220px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px 22px;

      background: #ffffff;
      border-radius: 10px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.16);

      overflow: hidden;
    }

    .fc-logo-box img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 62px;
      object-fit: contain;
    }

    /* SAR360 */

    .fc-logo-box.fc-sar360 img {
      max-width: 175px;
      max-height: 56px;
    }

    /* ANIMAZIONE */

    @keyframes fc-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* TABLET */

    @media (max-width: 900px) {

      .fc-clienti {
        padding: 55px 0 60px;
      }

      .fc-logo-box {
        width: 190px;
        height: 88px;
        flex-basis: 190px;
      }

      .fc-logo-box img {
        max-height: 54px;
      }

      .fc-marquee-group {
        gap: 18px;
        padding-right: 18px;
      }

      .fc-marquee-track {
        animation-duration: calc(28s * var(--fc-k, 1));
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .fc-clienti {
        padding: 50px 0 55px;
      }

      .fc-clienti h2 {
        font-size: 19px;
      }

      .fc-clienti-intro {
        font-size: 14px;
        margin-bottom: 32px;
      }

      .fc-logo-box {
        width: 160px;
        height: 78px;
        flex-basis: 160px;
        padding: 12px 16px;
      }

      .fc-logo-box img {
        max-height: 45px;
      }

      .fc-logo-box.fc-sar360 img {
        max-width: 135px;
        max-height: 44px;
      }

      .fc-marquee-group {
        gap: 14px;
        padding-right: 14px;
      }

      .fc-marquee-track {
        animation-duration: calc(24s * var(--fc-k, 1));
      }

      .fc-marquee::before,
      .fc-marquee::after {
        width: 55px;
      }
    }

    /* ACCESSIBILITÀ */

    @media (prefers-reduced-motion: reduce) {

      .fc-marquee-track {
        animation: none;
      }
    }
  </style>
</head>

<body>

<section class="fc-clienti">
  <div class="fc-clienti-inner" id="fc-testi"></div>
  <div class="fc-marquee">
    <div class="fc-marquee-track" id="fc-track"></div>
  </div>
</section>

<!--FC-KIT-->
<script>
(function () {
  var E = FCKit.esc;
  var DATI = {
    titolo: "Aziende che ci hanno scelto",
    intro: "La nostra esperienza nasce dalla capacità di progettare e gestire impianti per realtà con esigenze diverse.",
    loghi: [
      { nome: "Poretti & Gaggini SA", img: "https://bin.staticlocal.ch/logo-ad/93/937a1f015d0fa5522baef308f25cac059045cac0/upload1.jpg", dim: "" },
      { nome: "Imerys Graphite & Carbon", img: "https://images.squarespace-cdn.com/content/v1/6593df3a3cae2759c637e94d/33049bd8-af10-4ce0-a658-2425d83cec59/13.png?format=2500w", dim: "" },
      { nome: "Raiffeisen Schweiz", img: "https://upload.wikimedia.org/wikipedia/commons/9/98/Raiffeisen_Schweiz_Logo.svg", dim: "" },
      { nome: "SAR360 Architettura", img: "https://media.licdn.com/dms/image/v2/D4E1BAQGyiowCLr69Tg/company-background_10000/company-background_10000/0/1658495896152/sar360_sagl_cover?e=2147483647&t=ngQ4o_Mhpoe57MD7IjrmXCDQkeCMlaWvQhViRl46tT4&v=beta", dim: "fc-sar360" },
      { nome: "Autolinee Bleniesi SA", img: "https://images.seeklogo.com/logo-png/34/1/autolinee-bleniesi-logo-png_seeklogo-349107.png", dim: "" },
      { nome: "Diamond SA", img: "https://www.flyelectronics.it/IMMAGINI/655Diamond_Manifaturies_Fly-Electronics.jpg", dim: "" }
    ]
  };
  var SCHEMA = [
    { t: "testo", k: "titolo", l: "Titolo" },
    { t: "area", k: "intro", l: "Testo introduttivo" },
    { t: "lista", k: "loghi", l: "Loghi dei clienti", agg: "Aggiungi un logo", titolo: "nome", miniatura: "img", min: 1,
      aiuto: "I loghi scorrono in un ciclo continuo; la velocità si adatta da sola al numero di loghi.",
      nuovo: { nome: "", img: "", dim: "" },
      voce: { t: "gruppo", campi: [
        { t: "testo", k: "nome", l: "Nome dell'azienda" },
        { t: "img", k: "img", l: "Logo" },
        { t: "sel", k: "dim", l: "Dimensione nel riquadro", opz: [["", "Standard"], ["fc-sar360", "Ridotta (per loghi molto larghi)"]] }
      ] } }
  ];
  function render(d) {
    var l = d.loghi || [];
    document.getElementById("fc-testi").innerHTML = "<h2>" + E(d.titolo) + '</h2><p class="fc-clienti-intro">' + E(d.intro) + "</p>";
    var gruppo = function (copia) {
      return '<div class="fc-marquee-group"' + (copia ? ' aria-hidden="true"' : "") + ">" + l.map(function (x) {
        return '<div class="fc-logo-box' + (x.dim ? " " + E(x.dim) : "") + '"><img src="' + E(x.img) + '" alt="' + (copia ? "" : E(x.nome)) + '"></div>';
      }).join("") + "</div>";
    };
    var t = document.getElementById("fc-track");
    t.innerHTML = gruppo(false) + gruppo(true);
    t.style.setProperty("--fc-k", String(l.length / 6));
  }
  FCKit.avvia({ id: "clima-clienti", nome: "Climatizzazione · Aziende che ci hanno scelto", dati: DATI, schema: SCHEMA,
                render: render, ingranaggio: { pos: "br", tono: "scuro" } });
})();
</script>

</body>
</html>

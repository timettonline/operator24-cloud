<!-- =====================================================================
     Frigo Control Ticino — Climatizzatori a pavimento — VERSIONE BOX FISSO (Wix)
     - Pannello a dimensione FISSA: riempie l'elemento Wix (larghezza x altezza)
     - Ogni vista (home / SFZ-M / MFZ-KT) riempie ESATTAMENTE il box: stessa
       identica dimensione, il click NON allunga nulla
     - Contenuti sintetici e uniformi, pensati per stare dentro senza scroll
     - Su Wix: Incorpora HTML, poi imposta larghezza e altezza dell'elemento
       (consigliato ~ 640 px di altezza desktop). Il box resta sempre uguale.
     ===================================================================== -->
<div id="fc-clima">
  <style>
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  #fc-clima *{box-sizing:border-box;margin:0;padding:0}
  #fc-clima{
    --blu:#0a3d62;--blu2:#1e6091;--accent:#00a8e8;--grigio:#f4f6f8;--bordo:#e3e9ef;--testo:#22303a;--muto:#6b7b88;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);position:relative;height:100%;width:100%;overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0%,#eef4f8 100%);
    -webkit-tap-highlight-color:transparent;
  }
  #fc-clima img{max-width:100%;display:block}
  #fc-clima h1,#fc-clima h2,#fc-clima h3,#fc-clima h4{color:var(--blu);line-height:1.15}

  /* protezione immagini */
  #fc-clima .pz{position:relative;overflow:hidden;border-radius:10px;background:#eef2f5}
  #fc-clima .pz img{width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none;pointer-events:none}
  #fc-clima .pz.ct img{object-fit:contain;background:#fff}
  #fc-clima .pz::after{content:"";position:absolute;inset:0;z-index:2}

  /* Le VISTE riempiono tutte lo stesso box (stessa dimensione esatta) */
  #fc-clima .view{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(12px,2.2vw,22px);overflow:hidden}
  #fc-clima .view.on{display:flex;animation:fade .3s ease}
  /* su mobile il box resta fisso ma il contenuto puo scorrere al suo interno */
  @media(max-width:640px){#fc-clima .view{overflow-y:auto;-webkit-overflow-scrolling:touch}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* HOME */
  #fc-clima .kick{letter-spacing:.12em;text-transform:uppercase;font-size:.62rem;font-weight:800;color:var(--accent);text-align:center}
  #fc-clima .home h1{font-size:clamp(1.1rem,2.3vw,1.6rem);font-weight:800;text-align:center;margin:6px 0 4px}
  #fc-clima .home .sub{text-align:center;color:var(--muto);font-size:.85rem;max-width:620px;margin:0 auto 12px}
  #fc-clima .cards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
  #fc-clima .card{display:flex;flex-direction:column;border:1px solid var(--bordo);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(10,61,98,.10);cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;min-height:0}
  #fc-clima .card:hover{box-shadow:0 14px 30px rgba(10,61,98,.18)}
  #fc-clima .card .ph{flex:1;min-height:0}
  #fc-clima .card .bd{padding:12px 14px 14px}
  #fc-clima .badge{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff}
  #fc-clima .sfz .badge,#fc-clima .badge.sfz{background:linear-gradient(135deg,#062a4d,#1e6091)}
  #fc-clima .mfz .badge,#fc-clima .badge.mfz{background:linear-gradient(135deg,#12557f,#00a8e8)}
  #fc-clima .card h3{font-size:1rem;margin:8px 0 2px}
  #fc-clima .card .mod{font-size:.72rem;color:var(--muto);font-weight:600;margin-bottom:6px}
  #fc-clima .card p{font-size:.8rem;color:var(--testo)}
  #fc-clima .card .go{margin-top:8px;font-weight:700;color:var(--accent);font-size:.8rem}
  #fc-clima .home .foot{text-align:center;color:var(--muto);font-size:.72rem;padding-top:10px}
  @media(max-width:620px){#fc-clima .cards{grid-template-columns:1fr}}

  /* DETTAGLIO PRODOTTO */
  #fc-clima .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:0 0 auto}
  #fc-clima .back{background:none;border:none;cursor:pointer;color:var(--blu);font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;font-family:inherit;padding:2px 4px}
  #fc-clima .back:hover{color:var(--accent)}
  #fc-clima .top h2{font-size:clamp(1rem,2vw,1.35rem)}
  #fc-clima .top .mod{color:var(--muto);font-weight:600;font-size:.78rem}
  #fc-clima .body{flex:1;display:grid;grid-template-columns:1.02fr .98fr;gap:16px;min-height:0}
  @media(max-width:640px){#fc-clima .body{grid-template-columns:1fr;overflow-y:auto}}
  #fc-clima .gal{display:flex;flex-direction:column;min-height:0}
  #fc-clima .gal .main{flex:1;min-height:0}
  #fc-clima .gal .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;flex:0 0 auto}
  #fc-clima .gal .thumbs .t{height:46px;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;padding:0;background:none}
  #fc-clima .gal .thumbs .t.on{border-color:var(--accent)}
  #fc-clima .gal .thumbs .t .pz,#fc-clima .gal .thumbs .t img{height:100%;border-radius:0}
  #fc-clima .info{display:flex;flex-direction:column;min-height:0}
  #fc-clima .info .intro{font-size:.82rem;color:var(--testo);margin-bottom:8px}
  #fc-clima .info h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muto);margin-bottom:6px}
  #fc-clima .spec{list-style:none;display:grid;gap:5px;margin-bottom:10px}
  #fc-clima .spec li{display:flex;gap:7px;align-items:flex-start;font-size:.82rem}
  #fc-clima .spec li svg{flex:0 0 15px;margin-top:2px;color:var(--accent)}
  #fc-clima .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  #fc-clima .chip{display:inline-flex;align-items:center;gap:5px;background:var(--grigio);border:1px solid var(--bordo);color:var(--blu);border-radius:999px;padding:4px 9px;font-size:.7rem;font-weight:600}
  #fc-clima .chip svg{color:var(--accent)}
  #fc-clima .tec{margin-top:auto;background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;border-radius:10px;padding:10px 12px;font-size:.76rem;line-height:1.4}
  #fc-clima .tec b{color:#bfe9ff}
  </style>

  <!-- ===== HOME ===== -->
  <div class="view home on" data-view="home">
    <div class="kick">Frigo Control Ticino · Mitsubishi Electric</div>
    <h1>Climatizzatori a pavimento</h1>
    <div class="sub">Comfort discreto a livello del suolo, ideale dove non puoi montare l'unità in alto. Scegli la soluzione:</div>
    <div class="cards">
      <button class="card sfz" type="button" data-open="sfz">
        <div class="ph pz"><img src="https://frigocontrolch.10web.me/wp-content/uploads/2025/08/climatizzatore-a-pavimento-incasso-soggiorno-frigo-control-ticino-600x449.webp" alt="Unità ad incasso SFZ-M" loading="lazy"></div>
        <div class="bd"><span class="badge">Incasso</span><h3>Unità ad incasso SFZ-M</h3><div class="mod">Serie S</div><p>Si integra nella parete, doppia aspirazione dell'aria e ventilatore DC Inverter.</p><div class="go">Scopri →</div></div>
      </button>
      <button class="card mfz" type="button" data-open="mfz">
        <div class="ph pz"><img src="https://frigocontrolch.10web.me/wp-content/uploads/2025/08/climatizzatore-a-pavimento-mfz-kt-soggiorno-frigo-control-ticino.webp" alt="A pavimento MFZ-KT" loading="lazy"></div>
        <div class="bd"><span class="badge">A pavimento</span><h3>A pavimento MFZ-KT</h3><div class="mod">Serie M</div><p>Estetica moderna, filtro V Blocking in dotazione e Multi-flow vane.</p><div class="go">Scopri →</div></div>
      </button>
    </div>
    <div class="foot">Sopralluogo gratuito · Installazione e assistenza in Ticino · Refrigerante R32</div>
  </div>

  <!-- ===== VISTE PRODOTTO (render JS) ===== -->
  <div class="view" data-view="sfz" id="v-sfz"></div>
  <div class="view" data-view="mfz" id="v-mfz"></div>

  <script>
  (function(){
    var root=document.getElementById('fc-clima');
    if(root.dataset.init) return; root.dataset.init='1';
    var CK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    function ic(t){t=t.toLowerCase();
      var p={leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
        remote:'<rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="12" r="1.5"/>',
        air:'<path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>',
        vol:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>',
        floor:'<path d="M3 20h18"/><rect x="6" y="9" width="12" height="8" rx="1"/>'};
      var d=/r32|refriger/.test(t)?p.leaf:/remoto|controllo|remote/.test(t)?p.remote:/purific|aria|air|filtro/.test(t)?p.air:/silenz/.test(t)?p.vol:p.floor;
      return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
    }
    var U='https://frigocontrolch.10web.me/wp-content/uploads/';
    var DATA={
      sfz:{badge:'Incasso',cls:'sfz',titolo:'Unità ad incasso SFZ-M',mod:'Serie S',
        intro:'Si integra nella parete per un risultato pulito e discreto, con doppia aspirazione dell’aria e ventilatore DC Inverter.',
        gallery:[
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-soggiorno-frigo-control-ticino-600x449.webp',c:'In soggiorno moderno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-sfz-m-kit-frigo-control-ticino.webp',c:'Kit interno + esterno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-sfz-m-frigo-control-ticino-600x600.webp',c:'Unità interna'},
          {s:U+'2025/08/climatizzatore-a-pavimento-incasso-soggiorno-moderno-frigo-control-ticino-600x449.webp',c:'Sotto finestra'}
        ],
        spec:['Alta efficienza energetica stagionale','Portata d’aria regolabile (DC Inverter)','Doppia possibilità di aspirazione dell’aria','Dimensioni super compatte','Gas refrigerante R32','Controllo Wi-Fi MELCloud opzionale'],
        chips:['A pavimento','Controllo remoto','Gas R32','Silenziosità'],
        tec:'Sistema <b>monosplit</b> o <b>multisplit</b> (MXZ / MXZ Hyper Heating) · Gas <b>R32</b> · classe fino ad <b>A++</b> in raffreddamento e <b>A+</b> in riscaldamento.'
      },
      mfz:{badge:'A pavimento',cls:'mfz',titolo:'A pavimento MFZ-KT',mod:'Serie M',
        intro:'Estetica moderna ed elegante, con filtro purificatore V Blocking in dotazione, sistema Multi-flow vane ed elevata capacità di riscaldamento.',
        gallery:[
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-soggiorno-frigo-control-ticino.webp',c:'In soggiorno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-design-moderno-frigo-control-ticino.webp',c:'Design moderno'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-frontale-frigo-control-ticino.webp',c:'Vista frontale'},
          {s:U+'2025/08/climatizzatore-a-pavimento-mfz-kt-dimensioni-frigo-control-ticino.webp',c:'Dimensioni'}
        ],
        spec:['Estetica moderna ed elegante','Filtro purificatore V Blocking in dotazione','Sistema Multi-flow vane','Elevata capacità di riscaldamento','Gas refrigerante R32','Elevata silenziosità'],
        chips:['A pavimento','Controllo remoto','Purificazione aria','Gas R32','Silenziosità'],
        tec:'Potenze <b>2,5 – 5,0 kW</b> · SEER fino a <b>6,8</b> · classe <b>A++</b> (raffr.) / <b>A+</b> (risc.) · Gas <b>R32</b> · mono e multisplit.'
      }
    };
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function render(key){
      var d=DATA[key];
      var thumbs=d.gallery.map(function(g,i){return '<button type="button" class="t'+(i===0?' on':'')+'" data-i="'+i+'"><span class="pz"><img src="'+g.s+'" alt="'+esc(g.c)+'" loading="lazy"></span></button>';}).join('');
      var spec=d.spec.map(function(s){return '<li>'+CK+'<span>'+esc(s)+'</span></li>';}).join('');
      var chips=d.chips.map(function(c){return '<span class="chip">'+ic(c)+esc(c)+'</span>';}).join('');
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button>'
        +'<span class="badge '+d.cls+'">'+esc(d.badge)+'</span><h2>'+esc(d.titolo)+'</h2><span class="mod">'+esc(d.mod)+'</span></div>'
        +'<div class="body">'
          +'<div class="gal"><div class="main pz ct"><img id="m-'+key+'" src="'+d.gallery[0].s+'" alt="'+esc(d.gallery[0].c)+'"></div>'
            +'<div class="thumbs" data-th="'+key+'">'+thumbs+'</div></div>'
          +'<div class="info"><div class="intro">'+esc(d.intro)+'</div>'
            +'<h4>Caratteristiche principali</h4><ul class="spec">'+spec+'</ul>'
            +'<div class="chips">'+chips+'</div>'
            +'<div class="tec">'+d.tec+'</div></div>'
        +'</div>';
    }
    document.getElementById('v-sfz').innerHTML=render('sfz');
    document.getElementById('v-mfz').innerHTML=render('mfz');

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ show(op.getAttribute('data-open')); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var th=e.target.closest('.thumbs .t');
      if(th){ var row=th.parentNode; var key=row.getAttribute('data-th'); var i=+th.getAttribute('data-i');
        var g=DATA[key].gallery[i]; var m=document.getElementById('m-'+key); m.src=g.s; m.alt=g.c;
        row.querySelectorAll('.t').forEach(function(x){x.classList.remove('on');}); th.classList.add('on'); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });
  })();
  </script>
</div>

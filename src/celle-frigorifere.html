  #fc-app .view{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:1200px;display:none;flex-direction:column;padding:clamp(12px,2vw,22px);gap:10px}
  #fc-app .view.on{display:flex;animation:fd .25s ease}
  @keyframes fd{from{opacity:0}to{opacity:1}}

  #fc-app .foot{flex:0 0 auto;text-align:center;color:var(--muto);font-size:.7rem}

  #fc-app .top{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #fc-app .back{background:none;border:none;cursor:pointer;color:var(--blu);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;font-family:inherit;padding:2px 4px}
  #fc-app .back:hover{color:var(--accent)}
  #fc-app .top h2{font-size:clamp(.98rem,1.8vw,1.25rem)}
  #fc-app .fdesc{flex:0 0 auto;font-size:.8rem;color:var(--muto);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #fc-app .modelbar{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
  #fc-app .mchip{white-space:nowrap;border:1px solid var(--bordo);background:#fff;border-radius:999px;padding:6px 12px;font-size:.74rem;font-weight:700;color:var(--muto);cursor:pointer;font-family:inherit}
  #fc-app .mchip.on{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;border-color:transparent}
  #fc-app .fbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){#fc-app .fbody{grid-template-columns:1fr;grid-template-rows:minmax(150px,40%) 1fr;overflow:hidden}}
  #fc-app .gal{min-height:0;display:flex;flex-direction:column;gap:8px}
  #fc-app .gal .main{flex:1;min-height:0}
  #fc-app .gal .thumbs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #fc-app .gal .thumbs.hide{display:none}
  #fc-app .gal .thumbs .t{height:44px;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;padding:0;background:none}
  #fc-app .gal .thumbs .t.on{border-color:var(--accent)}
  #fc-app .gal .thumbs .t .pz,#fc-app .gal .thumbs .t img{height:100%;border-radius:0}
  #fc-app .fspec{min-height:0;display:flex;flex-direction:column;overflow:auto}
  #fc-app .fspec h5{font-size:1rem;margin-bottom:6px}
  #fc-app .mtext{font-size:.82rem;line-height:1.5;color:var(--testo);margin-bottom:8px}
  #fc-app .frow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--bordo);font-size:.8rem}
  #fc-app .frow .l{color:var(--muto)}
  #fc-app .frow .v{font-weight:700;color:var(--blu);text-align:right}
  #fc-app h6.eyer{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muto);margin:12px 0 6px}
  #fc-app .carat{list-style:none;display:grid;gap:4px}

        return '<h6 class="eyer">'+esc(sec.title)+'</h6><ul class="seclist">'+sec.items.map(function(it){
          return '<li class="secitem"><span class="pz ct thumb"><img src="'+esc(it.img)+'" alt="'+esc(it.name)+'" loading="lazy"></span>'
            +'<span class="sectxt"><b>'+esc(it.name)+'</b>'+esc(it.desc)+'</span></li>';
        }).join('')+'</ul>';
      }).join('');
    }
    function renderFam(k){
      var f=FAM[k];
      var chips=f.models.map(function(m,i){return '<button class="mchip'+(i===0?' on':'')+'" type="button" data-i="'+i+'">'+esc(m.name)+'</button>';}).join('');
      return '<div class="top"><button class="back" type="button" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Indietro</button><span class="badge">'+esc(TX.badge)+'</span><h2>'+esc(f.name)+'</h2></div>'
        +'<div class="fdesc">'+esc(f.desc)+'</div>'
        +'<div class="modelbar" data-fam="'+k+'">'+chips+'</div>'
        +'<div class="fbody">'
          +'<div class="gal"><div class="main pz ct"><img id="gm-'+k+'"></div><div class="thumbs" id="gt-'+k+'"></div></div>'
          +'<div class="fspec"><h5 id="mn-'+k+'"></h5><div id="fs-'+k+'"></div><div id="sec-'+k+'">'+secHTML(f)+'</div></div>'
        +'</div>';
    }

    function setModel(k,i){
      var f=FAM[k],m=f&&f.models[i]; if(!m) return; cur[k]={model:i};
      document.getElementById('mn-'+k).textContent=m.name;
      var html='';
      if(m.text) html+='<p class="mtext">'+esc(m.text)+'</p>';
      if(m.spec.length) html+=m.spec.map(function(s){return '<div class="frow"><span class="l">'+esc(s.l)+'</span><span class="v">'+esc(s.v)+'</span></div>';}).join('');
      if(m.carat.length) html+='<h6 class="eyer">'+esc(TX.titoloCarat)+'</h6><ul class="carat">'+m.carat.map(function(x){return '<li>'+CK+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>';
      document.getElementById('fs-'+k).innerHTML=html;
      var gm=document.getElementById('gm-'+k); gm.src=m.imgs[0]||''; gm.alt=m.name;
      var gt=document.getElementById('gt-'+k);
      gt.innerHTML=m.imgs.map(function(u,j){return '<button class="t'+(j===0?' on':'')+'" type="button" data-img="'+j+'"><span class="pz"><img src="'+esc(u)+'" alt="'+esc(m.name)+'" loading="lazy"></span></button>';}).join('');
      gt.classList.toggle('hide',m.imgs.length<2);
      var bar=document.querySelector('.modelbar[data-fam="'+k+'"]');
      if(bar) bar.querySelectorAll('.mchip').forEach(function(c,ci){c.classList.toggle('on',ci===i);});
      var fs=document.querySelector('#v-'+k+' .fspec'); if(fs) fs.scrollTop=0;
    }

    /* disegna tutto a partire dai dati */
    function render(d){
      FAM={}; ORDER=[]; cur={}; TX=d.home||{};
      d.famiglie.forEach(function(f,i){ var k='f'+i; FAM[k]=f; ORDER.push(k); });
      document.getElementById('fc-kick').textContent=TX.kick;
      document.getElementById('fc-titolo').textContent=TX.titolo;
      document.getElementById('fc-sub').textContent=TX.sub;
      document.getElementById('fc-foot').textContent=TX.foot;
      /* home cards */
      document.getElementById('cards').innerHTML=ORDER.map(function(k){var f=FAM[k];
        return '<button class="card" type="button" data-open="'+k+'"><div class="ph"><div class="pz ct"><img src="'+esc(f.card)+'" alt="'+esc(f.name)+'" loading="lazy"></div></div>'
          +'<div class="bd"><span class="badge">'+esc(TX.badge)+'</span><h3>'+esc(f.name)+'</h3><p>'+esc(f.tag)+'</p><div class="go">Scopri →</div></div></button>';
      }).join('');
      /* viste delle gamme */
      root.querySelectorAll('.view:not(.home)').forEach(function(v){v.remove();});
      var fine=root.querySelector('script');
      ORDER.forEach(function(k){
        var v=document.createElement('div'); v.className='view'; v.setAttribute('data-view',k); v.id='v-'+k;
        v.innerHTML=renderFam(k); root.insertBefore(v,fine);
      });
      ORDER.forEach(function(k){ setModel(k,0); });
      show('home');
    }

    function show(v){ root.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on', el.getAttribute('data-view')===v);}); }
    root.addEventListener('click',function(e){
      var op=e.target.closest('[data-open]'); if(op){ var v=op.getAttribute('data-open'); show(v); setModel(v,0); return; }
      if(e.target.closest('[data-back]')){ show('home'); return; }
      var mc=e.target.closest('.mchip'); if(mc){ var k=mc.closest('.modelbar').getAttribute('data-fam'); setModel(k,+mc.getAttribute('data-i')); return; }
      var th=e.target.closest('.thumbs .t'); if(th){ var view=th.closest('.view'); var k=view.getAttribute('data-view'); var j=+th.getAttribute('data-img');
        var m=FAM[k].models[cur[k].model]; var gm=document.getElementById('gm-'+k); gm.src=m.imgs[j]; gm.alt=m.name;
        view.querySelectorAll('.thumbs .t').forEach(function(x){x.classList.remove('on');}); th.classList.add('on'); return; }
    });
    root.addEventListener('contextmenu',function(e){ if(e.target.closest('.pz,img')) e.preventDefault(); });
    root.addEventListener('dragstart',function(e){ if(e.target.tagName==='IMG') e.preventDefault(); });

    FCKit.avvia({id:'celle-frigorifere',nome:'Celle frigorifere',dati:DATI,schema:SCHEMA,render:render,ingranaggio:{pos:'br',tono:'chiaro'}});
  })();
  </script>
</div>
